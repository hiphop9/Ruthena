// Athena 캐릭터 서버 설정 파일.

// 참고: "주석"은 더블 슬래시 "//"의 오른쪽에 있는 모든 텍스트입니다.
// 주석 처리된 텍스트는 서버에서 파싱되지 않으며, 정보/참조로만 사용됩니다.

// 서버 통신용 사용자 이름과 비밀번호.
userid: s1
passwd: p1

// 서버 이름, 공백 대신 ASCII 160과 같은 대체 문자를 사용합니다.
// 참고: Windows 파일 이름에 허용되지 않는 \/:*?"<>| 문자는 사용하지 마십시오.
// 그렇지 않으면 클라이언트 측에서 길드 엠블렘이 작동하지 않습니다!
server_name: rAthena

// 서버의 귓속말 이름: 서버에서 플레이어에게 귓속말을 보내는 데 사용됩니다 (4 ~ 23자 사이)
wisp_server_name: Server

// 로그인 서버 IP
// 캐릭터 서버가 로그인 서버에 연결할 때 이 IP 주소를 사용합니다.
// 참고: 방화벽 뒤에서 실행하거나 여러 인터페이스가 있는 머신에서 유용합니다.
//login_ip: 127.0.0.1

// 캐릭터 서버가 이 IP 주소로 인터페이스에 연결합니다.
// 참고: 여러 인터페이스에서 동일한 포트를 사용하여 여러 서버를 실행할 수 있습니다.
//bind_ip: 127.0.0.1

// 로그인 서버 포트
login_port: 6900

// 캐릭터 서버 IP
// 클라이언트가 연결할 때 사용하는 IP 주소를 설정합니다.
// 서버의 공용 IP 주소로 설정하십시오.
//char_ip: 127.0.0.1

// 캐릭터 서버 포트
char_port: 6121

// 모든 메시지 앞에 인쇄되는 타임스탬프 형식.
// 최대 20자까지 가능합니다.
// 일반적인 형식:
// %I:%M:%S %p (시간:분:초 12시간 형식, AM/PM)
// %H:%M:%S (시간:분:초, 24시간 형식)
// %d/%b/%Y (일/월/년)
// 전체 형식 정보는 strftime() 매뉴얼을 참조하십시오.
//timestamp_format: [%d/%b %H:%M]

// 리디렉션된 출력에 이스케이프 시퀀스(컬러 코드)가 포함되어 있습니까?
stdout_with_ansisequence: no

// 서버가 선택한 메시지 유형을 /log/ 폴더에 파일로 기록합니다.
// 1: 경고 메시지 기록
// 2: 오류 및 SQL 오류 메시지 기록
// 4: 디버그 메시지 기록
// 예: "console_msg_log: 7"은 세 가지 모두 기록합니다.
// 기록된 메시지는 console_silent 설정을 무시합니다.
console_msg_log: 0

// 위의 콘솔 메시지를 저장할 파일 경로
console_log_filepath: ./log/char-msg_log.log

// 특정 유형의 메시지를 생략하여 서버 출력을 더 조용하게 만듭니다:
// 1: 정보 메시지 숨기기
// 2: 상태 메시지 숨기기
// 4: 공지 메시지 숨기기
// 8: 경고 메시지 숨기기
// 16: 오류 및 SQL 오류 메시지 숨기기
// 32: 디버그 메시지 숨기기
// 예: "console_silent: 7"은 정보, 상태 및 공지 메시지를 숨깁니다 (1+2+4)
console_silent: 0

// 콘솔 명령
// 콘솔 명령 사용 여부를 켜고 끕니다.
// 이것은 >& log.file 사용을 방지합니다.
console: off

// 서버 유형.
// 현재 기능적인 부작용은 없습니다.
// 클라이언트에서 서버 이름 옆에 표시됩니다.
// 0=일반, 1=유지보수, 2=18세 이상, 3=유료, 4=P2P
char_maintenance: 0

// 새로운 캐릭터 생성 허용 여부.
// 이제 실제로 지원됩니다 [Kevin]
char_new: yes

// 서버 목록에 (New) 표시.
char_new_display: 0

// 서버에 연결할 수 있는 최대 사용자 수.
// 0으로 설정하면 로그인을 비활성화합니다. (-1은 무제한)
max_connect_user: -1

// 서버 제한을 초과하여 사용자가 접속할 수 있도록 허용하는 그룹 ID.
// 또는 캐릭터가 유지보수 모드일 때 접속 가능 (groupid >= allow)
// 기본값: -1 = 아무도 없음 (ID < 0인 그룹 없음)
// 참조: conf/groups.conf
gm_allow_group: 99

// 길드 정보를 얼마나 자주 저장해야 합니까? (초 단위)
// (캐릭터 자동 저장 간격은 맵 설정 (autosave_time)에 정의됨)
autosave_time: 60

// 캐릭터/길드/파티/펫이 로드/저장될 때마다 콘솔에 정보를 표시합니까?
save_log: yes

// 새 캐릭터의 시작 위치
// 형식: <map_name>,<x>,<y>{:<map_name>,<x>,<y>...}
// 최대 시작 지점 수는 char.hpp의 MAX_STARTPOINT입니다 (기본값 5)
// 캐릭터 생성 시 위치가 무작위로 선택됩니다.
// 참고: Doram의 경우 20151001 또는 최신 클라이언트가 필요합니다.
//start_point: iz_int,18,26:iz_int01,18,26:iz_int02,18,26:iz_int03,18,26:iz_int04,18,26
start_point: iz_int,18,26
start_point_pre: new_1-1,53,111:new_2-1,53,111:new_3-1,53,111:new_4-1,53,111:new_5-1,53,111
start_point_doram: lasa_fild01,48,297

// 새 캐릭터의 시작 아이템
// 최대 아이템 수는 char.cpp의 MAX_STARTITEM입니다 (기본값 32)
// 형식: <id>,<amount>,<position>{:<id>,<amount>,<position>...}
// 아이템을 자동으로 장착하려면 장착할 위치를 포함하십시오. 그렇지 않으면 0을 사용하십시오.
// 참고: Doram의 경우 20151001 또는 최신 클라이언트가 필요합니다.
start_items: 1201,1,2:2301,1,16:23484,1,0
start_items_pre: 1201,1,2:2301,1,16
start_items_doram: 1681,1,2:2301,1,16

// 새 캐릭터의 시작 제니
start_zeny: 0

// 명성 목록 크기
fame_list_alchemist: 10
fame_list_blacksmith: 10
fame_list_taekwon: 10

// 길드 획득 경험치 수정자.
// 플레이어의 과세 경험치를 길드의 경험치에 추가하기 전에 조정합니다. 예를 들어, 200으로 설정하면 길드는 플레이어의 과세 경험치의 두 배를 받습니다.
guild_exp_rate: 100

// 알 수 없는 캐릭터에 사용되는 이름
unknown_char_name: Unknown

// 캐릭터 서버를 기록합니까?
log_char: yes

// 캐릭터 이름의 최소 길이.
// 클라이언트가 '4/6자 캐릭터 이름 제한 제거' diff 패치를 사용하는 경우를 제외하고 '4'로 설정해야 합니다.
char_name_min_length: 4

// 대소문자를 구분하여 동일한 이름을 허용할지 여부:
// 예: Test-test-TEST-TesT; 값: 0 허용하지 않음 (기본값), 1 허용
name_ignoring_case: no

// 캐릭터 이름에 가능한 문자/기호를 관리합니다. 제어 문자(0x00-0x1f)는 절대 허용되지 않습니다. 가능한 값은:
// 참고: 캐릭터, 파티 및 길드 이름에 적용됩니다.
// 0: 제한 없음 (기본값)
// 1: 'char_name_letters' 옵션에 있는 문자/기호만 허용.
// 2: 'char_name_letters' 옵션에 있는 문자/기호는 금지. 다른 모든 문자는 허용.
char_name_option: 2

// 'char_name_option' 옵션으로 사용하려는 문자/기호를 설정합니다.
// 참고: 공백을 추가하지 마십시오. 그렇지 않으면 'space'가 목록에 추가됩니다.
char_name_letters: #@$%!~

// 베이스 레벨로 캐릭터 삭제를 제한합니다.
// 0: 제한 없음 (플레이어가 모든 레벨의 캐릭터를 삭제할 수 있음)
// -X: 베이스 레벨 <= X 인 캐릭터는 삭제할 수 없음
// Y: 베이스 레벨 >= Y 인 캐릭터는 삭제할 수 없음
// 예: char_del_level: 80 (플레이어가 베이스 레벨 80 이상의 캐릭터를 삭제할 수 없음)
char_del_level: 0

// 캐릭터 삭제 지연 시간 (초 단위).
// 기본값: 86400 (24시간)
// 참고: 2010-08-03aragexeRE 또는 최신 클라이언트가 필요합니다.
char_del_delay: 0

// 이메일 주소 또는 생년월일로 캐릭터 삭제를 제한합니다.
// 플레이어가 언어 유형을 변경하고 캐릭터를 삭제하는 것을 제한합니다.
// 기본값은 클라이언트 날짜를 기준으로 합니다.
// 1: 이메일 주소
// 2: 생년월일
// 3: 이메일 주소 또는 생년월일
// 중요!
// - 이 구성은 삭제 요청에 대해 0x0068 또는 0x01fb를 보내는 클라이언트에서만 작동합니다.
// - 0x01fb를 사용하려면 최신 클라이언트(2013+)에 대해 langtype 1을 사용하십시오.
// - 0x0068 또는 0x01fb를 사용하지 않는 클라이언트는 기본적으로 생년월일(YYMMDD)만 사용합니다.
char_del_option: 2

// 파티나 길드에 속해 있는 동안 캐릭터 삭제를 제한합니다.
// 0: 제한 없음
// 1: 파티에 있는 동안 캐릭터를 삭제할 수 없음
// 2: 길드에 있는 동안 캐릭터를 삭제할 수 없음
// 3: 파티나 길드에 있는 동안 캐릭터를 삭제할 수 없음 (기본값)
char_del_restriction: 3

// 특정 클래스 생성 제한 (20151001aRagexe 이상에서만 기능 작동)
// 0: 캐릭터 생성 불가
// 1: 초보자만 생성 가능 (기본 프리 리뉴얼)
// 2: 소환사만 생성 가능
// 3: 초보자와 소환사 모두 생성 가능 (기본 리뉴얼)
// 사용자 정의 제한을 위해 주석 해제
//allowed_job_flag: 3

// 파티에 구성원이 없는 경우 시작 시 파티_db 테이블에서 파티를 삭제해야 합니까?
clear_parties: no

// 데이터베이스 파일이 포함된 폴더.
db_path: db

//===================================
// 핀코드 시스템
//===================================
// 참고: 2011-03-09aragexeRE 또는 최신 클라이언트가 필요합니다.
// 캐릭터를 선택하기 전에 창이 열리고 마우스만 사용하여 핀코드를 입력해야 합니다.
// 기본값: 예
pincode_enabled: no

// 사용자가 핀코드를 변경해야 하는 빈도.
// 0: 절대 변경하지 않음 (기본값)
// X: X일마다 변경
pincode_changetime: 0

// 사용자가 잘못된 핀코드를 입력할 수 있는 최대 횟수.
// 기본값: 3 (클라이언트 최대값)
pincode_maxtry: 3

// 시스템이 활성화된 경우 사용자가 핀코드를 사용해야 합니까?
// 기본값: 예
pincode_force: yes

// 반복된 숫자를 허용합니까?
// 기본값: 아니오
pincode_allow_repeated: no

// 연속된 숫자를 허용합니까?
// 기본값: 아니오
pincode_allow_sequential: no

//===================================
// 애드온 시스템
//===================================
// 캐릭터 이동
// 참고: 2011-09-28aragexeRE 또는 최신 클라이언트가 필요합니다.
// 사용자가 슬롯 간에 캐릭터를 이동할 수 있도록 합니다.
// 기본값: 예
char_move_enabled: yes

// 사용자가 사용 중인 슬롯으로 캐릭터를 이동할 수 있도록 허용합니까?
// 사용 중인 슬롯으로 이동하면 캐릭터가 교환됩니다.
// 기본값: 예
char_movetoused: yes

// 사용자가 원하는 만큼 자주 캐릭터를 이동할 수 있도록 허용합니까?
char_moves_unlimited: no

// 캐릭터 이름 변경
// 사용자가 파티에 있는 동안 캐릭터 이름을 변경할 수 있도록 허용합니까?
// 기본값: 아니오
char_rename_party: no

// 사용자가 길드에 있는 동안 캐릭터 이름을 변경할 수 있도록 허용합니까?
// 기본값: 아니오
char_rename_guild: no

// 서버 시작 시 SQL 테이블이 올바른지 확인해야 합니까?
char_checkdb: yes

// 캐릭터가 존재하지 않는 맵에 있을 경우 기본 맵.
default_map: prontera
default_map_x: 156
default_map_y: 191

// 몇 일 후에 비활성 클랜 구성원을 클랜에서 제거해야 합니까?
// 0: 절대 제거하지 않음
// X: X일 동안 로그인하지 않은 클랜 구성원을 제거
// 기본값: 14
clan_remove_inactive_days: 14

//===================================
// RODEX
//===================================
// 몇 일 후에 메일을 보낸 사람에게 반환해야 합니까?
// 0: 절대 반환하지 않음
// X: X일 후에 반환
// 기본값: 15
mail_return_days: 15

// 반환된 후 몇 일 후에 메일을 완전히 삭제해야 합니까?
// 0: 절대 삭제하지 않음
// X: 반환된 후 X일 후에 삭제
// 기본값: 15
mail_delete_days: 15

// '모두 가져오기' 버튼이 읽지 않은 메일 상태를 무시합니까?
// 아니오: 읽은 메일에서만 첨부 파일을 가져오기
// 예: 모든 메일에서 첨부 파일 가져오기
// 기본값: 예
mail_retrieve: yes

// 첨부 파일이 없는 메일을 보낸 사람에게 반환해야 합니까?
// 기본값: 예
mail_return_empty: yes

import: conf/import/char_conf.txt
