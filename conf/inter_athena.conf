// Athena InterServer 설정 파일.
// 여러 서버에서 공유/사용하는 설정이 포함되어 있습니다.

// 두 버전 모두에 대한 옵션

// 인터 서버 연결 등을 기록합니까?
log_inter: 1

// 인터 로그 파일 이름
inter_log_filename: log/inter.log

// 파티 내에서 공유할 수 있는 레벨 범위
party_share_level: 15

// 새로운 캐릭터가 시작할 때 얻는 상태 포인트 수
start_status_points: 48

// 공성전 중에 길드 엠블렘을 변경할 수 있습니까?
emblem_woe_change: yes

// 무효로 간주되기 전에 엠블렘에서 발견할 수 있는 투명한 픽셀 수는 몇 개입니까? (참고 2)
emblem_transparency_limit: 80

// MySQL 테이블에서 사용할 코드 페이지를 지정할 수 있습니다.
// (참고: 이 기능은 MySQL 4.1+가 필요합니다)
default_codepage: euckr

// IP에 대해서는 이상적으로 리눅스에서는 127.0.0.1 대신 localhost를 사용해야 합니다.
// 윈도우에서는 127.0.0.1을 사용해야 합니다. "Can't connect to local MySQL server through socket '/tmp/mysql.sock' (2)"와 같은 메시지가 표시되면
// localhost를 127.0.0.1로 변경하십시오.

// MySQL 로그인 서버
login_server_ip: 127.0.0.1
login_server_port: 3306
login_server_id: ragnarok
login_server_pw: ragnarok
login_server_db: Ruthena20240724
login_codepage:
login_case_sensitive: no

ipban_db_ip: 127.0.0.1
ipban_db_port: 3306
ipban_db_id: ragnarok
ipban_db_pw: ragnarok
ipban_db_db: Ruthena20240724
ipban_codepage:

// MySQL 캐릭터 서버
char_server_ip: 127.0.0.1
char_server_port: 3306
char_server_id: ragnarok
char_server_pw: ragnarok
char_server_db: Ruthena20240724

// MySQL 맵 서버
map_server_ip: 127.0.0.1
map_server_port: 3306
map_server_id: ragnarok
map_server_pw: ragnarok
map_server_db: Ruthena20240724

// MySQL 웹 서버
web_server_ip: 127.0.0.1
web_server_port: 3306
web_server_id: ragnarok
web_server_pw: ragnarok
web_server_db: Ruthena20240724

// MySQL 로그 데이터베이스
log_db_ip: 127.0.0.1
log_db_port: 3306
log_db_id: ragnarok
log_db_pw: ragnarok
log_db_db: Ruthena20240724
log_codepage:
log_login_db: loginlog

// MySQL 재연결 설정
// - mysql_reconnect_type:
//   1: MySQL이 실행 중에 연결이 끊어지면, 서버는 mysql_reconnect_count만큼 다시 연결을 시도하고 실패 시 종료합니다.
//   2: MySQL이 실행 중에 연결이 끊어지면, 무기한으로 다시 연결을 시도합니다.
mysql_reconnect_type: 2
mysql_reconnect_count: 1

// 이 줄 이후에는 데이터베이스를 잘 알고 있지 않는 한 변경하지 마십시오.
// 이는 자신의 설정을 알고 있으며, 특정 이유로 데이터베이스 레이아웃을 변경하려는 사람들을 위한 것입니다. [CLOWNISIUS]

// 모든 MySQL 데이터베이스 테이블 이름

// 로그인 데이터베이스 테이블
login_server_account_db: login
ipban_table: ipbanlist
global_acc_reg_num_table: global_acc_reg_num
global_acc_reg_str_table: global_acc_reg_str

// 캐릭터 데이터베이스 테이블
char_db: char
