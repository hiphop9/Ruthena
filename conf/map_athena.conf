//--------------------------------------------------------------
// rAthena 맵 서버 설정 파일
//--------------------------------------------------------------

// 참고: "주석"은 더블 슬래시 "//"의 오른쪽에 있는 모든 텍스트입니다.
// 주석 처리된 텍스트는 서버에서 파싱되지 않으며, 정보/참조용으로만 사용됩니다.

//--------------------------------------------------------------
//                     설정 정보
//--------------------------------------------------------------
// 계정 간 통신 비밀번호, account.txt (또는 이에 상응하는 파일)에 설정
userid: s1
passwd: p1

// 캐릭터 서버 IP
// 맵 서버는 이 IP 주소를 사용하여 캐릭터 서버에 연결합니다.
// 참고: 방화벽 뒤에서 실행하거나 여러 인터페이스가 있는 머신에서 유용합니다.
//char_ip: 127.0.0.1

// 맵 서버가 이 IP 주소로 인터페이스에서 수신 대기합니다.
// 참고: 이를 통해 여러 인터페이스에서 동일한 포트를 사용하여 여러 서버를 실행할 수 있습니다.
//bind_ip: 127.0.0.1

// 캐릭터 서버 포트
char_port: 6121

// 맵 서버 IP
// 클라이언트가 연결할 때 사용하는 IP 주소를 설정합니다.
// 서버의 공용 IP 주소로 설정하십시오.
//map_ip: 127.0.0.1

// 맵 서버 포트
map_port: 5121

// 모든 메시지 앞에 인쇄되는 타임스탬프 형식.
// 최대 20자까지 가능합니다.
// 일반적인 형식:
// %I:%M:%S %p (시간:분:초 12시간 형식, AM/PM 형식)
// %H:%M:%S (시간:분:초 24시간 형식)
// %d/%b/%Y (일/월/년)
// 전체 형식 정보는 strftime() 매뉴얼을 참조하십시오.
//timestamp_format: [%d/%b %H:%M]

// 리디렉션된 출력에 이스케이프 시퀀스(색상 코드)가 포함된 경우
stdout_with_ansisequence: no

// 서버가 선택한 메시지 유형을 /log/ 폴더에 파일로 기록합니다.
// 1: 경고 메시지 기록
// 2: 오류 및 SQL 오류 메시지 기록
// 4: 디버그 메시지 기록
// 예: "console_msg_log: 7"은 세 가지 모두 기록합니다.
// 이 설정으로 기록된 메시지는 console_silent 설정을 무시합니다.
console_msg_log: 0

// 위의 콘솔 메시지를 저장할 파일 경로
console_log_filepath: ./log/map-msg_log.log

// 특정 유형의 메시지를 생략하여 서버 출력을 더 조용하게 만듭니다:
// 1: 정보 메시지 숨기기
// 2: 상태 메시지 숨기기
// 4: 공지 메시지 숨기기
// 8: 경고 메시지 숨기기
// 16: 오류 및 SQL 오류 메시지 숨기기
// 32: 디버그 메시지 숨기기
// 예: "console_silent: 7"은 정보, 상태 및 공지 메시지를 숨깁니다 (1+2+4)
console_silent: 0

// 모든 데이터베이스 데이터를 어디에서 읽어야 합니까?
db_path: db

// @guildspy 및 @partyspy 명령을 활성화하시겠습니까?
// 참고: 이를 활성화하면 패킷 전송 성능이 저하됩니다.
enable_spy: no

// mapcache 대신 grf-files.txt에서 참조하는 GRF 파일 또는 데이터 디렉토리에서 GAT 및 RSW의 맵 데이터를 읽습니까?
use_grf: no

// 콘솔 명령
// 콘솔 명령 사용 여부를 켜고 끕니다.
// 이는 >& log.file 사용을 방지합니다.
console: off

// 데이터베이스 자동 저장 시간
// 모든 캐릭터는 이 시간 (초 단위) 내에 저장됩니다 (예: 
// 60명의 캐릭터가 온라인 상태일 때 60초마다 자동 저장 -> 매 초마다 한 명의 캐릭터가 저장됩니다)
autosave_time: 300

// 최소 데이터베이스 저장 간격 (밀리초 단위)
// 캐릭터를 이 속도보다 빠르게 저장하는 것을 방지합니다 (캐릭터 수가 증가함에 따라 char-server 저장-로드가 너무 높아지는 것을 방지)
minsave_time: 100

// autosave_time 외에도 플레이어가 다음에 관여할 때 저장됩니다 (필요에 따라 추가):
// 1: 모든 성공적인 거래 후
// 2: 벤딩 열기/모든 벤딩 거래 후
// 4: 창고/길드 창고 닫기 후
// 8: 펫 부화/알로 돌아간 후
// 16: 첨부 파일과 함께 메일을 성공적으로 보낸 후
// 32: 아이템을 경매에 성공적으로 제출한 후
// 64: 퀘스트를 성공적으로 얻거나 삭제하거나 완료한 후
// 128: 모든 은행 거래 (입금/출금) 후
// 256: 모든 출석 보상 후
// 4095: 항상
// 참고: 이러한 설정은 서버 충돌 시 복제/분실 아이템의 가능성을 줄이는 대신 맵/char 서버 지연을 증가시킵니다. 
// 서버가 거의 충돌하지 않지만, 인터서버 지연이 발생하는 경우 이를 비활성화할 수 있습니다.
save_settings: 4095

// 로그인 시 표시되는 메시지 파일
motd_txt: conf/motd.txt

// @help 또는 @h를 입력하면 새로운 GM이 GM 명령을 이해하는 데 도움이 됩니다.
charhelp_txt: conf/charhelp.txt

// 채널 설정을 불러올 위치
channel_conf: conf/channels.conf

// 맵:
import: conf/maps_athena.conf

import: conf/import/map_conf.txt
