//--------------------------------------------------------------
// rAthena 전투 설정 파일
// 원래 번역: Peter Kieser <pfak@telus.net>
// 간단한 영어로 변경: Ancyker
//--------------------------------------------------------------
// 주의 1: 값은 설정 스위치 (on/off, yes/no 또는 1/0)
// 주의 2: 값은 백분율 (100은 100%를 의미합니다)
// 주의 3: 값은 비트 필드입니다. 설명이 없으면 기본적으로 단위 유형을 가정합니다 (1: Pc, 2: Mob, 4: Pet, 8: Homun, 16: Mercenary, 128: NPC, 512: Elemental)
//--------------------------------------------------------------

// 펫 포획률 계산에 레거시 공식을 사용합니까? (참고 1)
// 레거시 Athena 공식:
// ( 기본 확률 + ( 플레이어 레벨 - 몬스터 레벨 ) * 30 + 플레이어 LUK * 20 ) * ( 200 - 현재 몬스터 HP 백분율 ) / 100
// 공식 공식: (기본값)
// 기본 확률 + ( 100 - 현재 몬스터 HP 백분율 ) * 기본 확률 / 100
pet_legacy_formula: no

// 펫 포획률 (참고 2)
pet_catch_rate: 100

// 플레이어가 잡으려는 몬스터에서 몇 셀 떨어져 있을 수 있습니까?
// 클라이언트는 몬스터를 잡으려고 할 때 자동으로 플레이어를 범위 내로 이동시킵니다.
// 기본값: 5
// 체크를 비활성화하려면 0으로 설정
pet_distance_check: 5

// 공식 서버에서는 플레이어가 몬스터를 숨기면 잡을 수 없습니다. (참고 1)
pet_hide_check: yes

// 펫 이름을 한 번 이상 지을 수 있습니까? (참고 1)
pet_rename: no

// 펫이 먹이를 먹을 때 친밀도가 상승하는 비율 (참고 2)
pet_friendly_rate: 100

// 펫이 배고파지는 비율 (참고 2)
pet_hungry_delay_rate: 100

// 펫이 스킬을 사용하기 위해 장비가 필요합니까? (참고 1)
// 이 보너스는 비공식이며 import/pet_db.yml에 있습니다.
pet_equip_required: yes

// 소유자가 인벤토리에 충분한 공간이 없을 경우 펫 장비가 파괴됩니까? (참고 1)
// 공식 동작은 "yes"이며, "no"로 설정하면 아이템이 장착된 상태로 유지됩니다.
pet_unequip_destroy: yes

// 주인이 몬스터를 공격할 때 펫도 공격합니까? (참고 1)
pet_attack_support: no

// 주인이 몬스터로부터 피해를 받을 때 펫이 반격합니까? (참고 1)
pet_damage_support: no

// 펫이 주인을 지원하기 위한 최소 친밀도. 기본값은 900입니다.
// (친밀도는 0에서 1000까지입니다). 이 최소값에서 지원율은 펫의 정상 값의 50%입니다.
// 최대 (1000)에서는 지원율이 150%입니다.
pet_support_min_friendly: 900

// 펫이 스킬을 사용할지 여부 (참고 1)
// 참고: 공격적인 펫 스킬은 적어도 pet_attack_support 또는
// pet_damage_support가 작동하려면 필요합니다 (공격 중에 트리거됩니다).
pet_status_support: no

// 펫이 주인을 전투에서 지원하는 비율 (참고 2)
// pet_attack_support 및 pet_damage_support에 영향을 미칩니다.
pet_support_rate: 100

// 펫의 피해로 인해 주인이 경험치를 받습니까?
pet_attack_exp_to_master: no

// 펫이 몬스터를 공격하여 얻는 경험치 비율
pet_attack_exp_rate: 100

// 펫 레벨링 시스템. 비활성화하려면 0을 사용하십시오 (기본값).
// 활성화되면 펫의 레벨은 주인의 고정 %입니다. (참고 2)
// 200%인 경우 펫은 레벨이 두 배이고, 50%인 경우 펫의 레벨이 절반입니다.
pet_lv_rate: 0

// 펫 레벨링이 활성화된 경우, 펫의 최대 스탯
pet_max_stats: 99

// 펫 레벨링이 활성화된 경우, 최소/최대 피해에 대한 제한을 설정합니다.
// 참고로 이는 atk1과 atk2만 제한합니다. pet_str을 활성화하면 최대 피해는 base_atk + pet_max_atk2가 됩니다.
pet_max_atk1: 500
pet_max_atk2: 1000

// 길드 전쟁 중에 펫이 비활성화됩니까?
// "yes"로 설정하면 WoE 시간 동안 성에 들어갈 때 펫이 자동으로 알로 돌아가며, 내부에서는 부화가 금지됩니다.
pet_disable_in_gvg: no

// petskillattack2 고정 피해가 식물의 무한 방어를 무시합니까? (참고 1)
pet_ignore_infinite_def: yes

// 주인이 죽었을 때 펫이 계속 공격합니까? (참고 1)
pet_master_dead: no

// 클라이언트 설정이 꺼져 있어도 자동 급여 알림을 보냅니까? (참고 1)
// 공식: 예
pet_autofeed_always: yes

// 펫 이동 속도.
// 1: 주인의 이동 속도 (공식)
// 2: DEFAULT_WALK_SPEED 값
// 3: 몬스터 데이터베이스 이동 속도
pet_walk_speed: 1
