//--------------------------------------------------------------
// rAthena 전투 설정 파일
// 원래 번역: Peter Kieser <pfak@telus.net>
// 간단한 영어로 변경: Ancyker
//--------------------------------------------------------------
// 주의 1: 값은 설정 스위치 (on/off, yes/no 또는 1/0)
// 주의 2: 값은 백분율 (100은 100%를 의미합니다)
// 주의 3: 값은 비트 필드입니다. 설명이 없는 경우,
//         단위 유형을 가정합니다 (1: Pc, 2: Mob, 4: Pet, 8: Homun, 16: Mercenary, 128: NPC, 512: Elemental)
//--------------------------------------------------------------

// 상인 벤드 스킬을 통해 아이템을 판매할 수 있는 최대 값 (제니 단위)
vending_max_value: 1000000000

// 플레이어의 제니와 아이템의 총 가격이 최대 제니를 초과하는 경우에도 아이템을 상점에 배치할 수 있습니까? (참고 1)
// "yes"로 설정하면 아이템은 상점에 배치되지만 다른 플레이어는 구매할 수 없습니다.
// 공식 동작은 "yes"이지만 일부 공식 서버에서는 클라이언트가 이를 허용하지 않습니다.
vending_over_max: yes

// 모든 벤딩 거래에 적용할 세금 (예: 10000 = 100%, 50 = 0.50%)
// 세금이 적용되면 구매자에게 아이템의 전체 가격이 부과되지만,
// 판매자는 전체 금액에서 세금을 제외한 금액을 받습니다.
vending_tax: 500

// 세금이 적용되기 전의 최소 총 구매 금액.
// 공식적으로 1억 제니 미만의 거래에는 세금이 부과되지 않습니다.
// 0으로 설정하면 모든 거래에 세금이 적용됩니다.
vending_tax_min: 100000000

// 아이템 판매에 성공했을 때 구매자의 이름을 표시합니까?
buyer_name: yes

// 대장장이 성공률 (참고 2)
weapon_produce_rate: 100

// 포션 제조 성공률 (참고 2)
potion_produce_rate: 100

// 제작된 아이템에 제작자의 이름을 표시합니까? (참고 3)
// 0x01: 제작된 무기
// 0x02: 제작된 포션
// 0x04: 제작된 화살
// 0x08: 제작된 성수/앤실라
// 0x10: 제작된 독 포션
// 0x80: 기타 제작된 아이템
produce_item_name_input: 0x03

// 데드 브랜치를 통해 소환된 몬스터가 공격적입니까? (참고 1)
dead_branch_active: yes

// 소환된 몬스터가 플레이어의 기본 레벨을 확인합니까? (데드 브랜치) (참고 1)
// 공식 서버에서는 아니오 - 데드/블러디 브랜치에서 소환된 몬스터는 어떤 레벨일 수 있습니다.
// "yes"로 변경하면 플레이어의 기본 레벨 이하의 몬스터만 소환됩니다.
random_monster_checklv: no

// 맵 변경 시 "사용 가능"으로 태그되지 않은 아이템을 확인하고
// 인벤토리/카트/창고에서 자동 삭제합니까?
// 참고: item_db에서 로드되지 않은 아이템은 사용 가능하지 않습니다.
// 0x1: 인벤토리
// 0x2: 카트
// 0x4: 창고
item_check: 0x0

// 아이템 사용 간의 최소 시간은 얼마입니까?
// 아이템 사용 간 지연에만 영향을 미치며, 힐링 아이템 남용을 방지합니다. 권장 ~500 ms
// 공식 서버에서는 0이지만, 봇/매크로 방지 조치로 100ms로 설정됩니다.
item_use_interval: 100

// 캐시 음식 사용 간의 최소 시간은 얼마입니까? 기본값: 60000 (1분)
cashfood_use_interval: 60000

// 상태 변화를 차단하기 전에 필요한 bNoMagicDamage의 레벨 (골든 시프 버그 카드).
// 예를 들어, 50으로 설정된 경우, 아이템이 bNoMagicDamage,40을 제공하면;
// 이는 마법 피해를 40% 줄이지만 상태 변화를 차단하지 않습니다.
gtb_sc_immunity: 50

// 오토스펠 카드 효과를 중첩할 수 있습니까?
// 참고: 동일한 스킬을 부여하는 다른 카드는 설정에 관계없이 항상 독립적으로 작동합니다.
autospell_stacking: no

// item_noequip.txt에 의해 비활성화된 사용 가능한 아이템을 소비할 수 있습니까? (참고 1)
// no = 소비할 수 없음
// yes = 효과 없이 소비됨
allow_consume_restricted_item: no

// item_noequip.txt에 의해 비활성화된 아이템을 장착할 수 있습니까? (참고 1)
// no = 장착할 수 없으며 맵에 들어갈 때 장착 해제됨
// yes = 장착할 수 있지만 효과 없음
// 장착에 제한된 카드가 포함된 경우 이 검사를 무시하지만 여전히 효과는 없습니다.
allow_equip_restricted_item: yes

// NPC와 상호 작용할 때 장비 변경을 허용합니까? (참고 1)
// 공식 서버 기본값: 프리 리뉴얼은 yes, 리뉴얼은 no
//item_enabled_npc: yes

// map_addflooritem이 아이템이 드롭 가능한지 확인하도록 허용합니까? (참고 1)
// yes인 경우, 드롭 불가 아이템은 플레이어의 인벤토리가 가득 차면 맵에 나타나지 않고 파괴됩니다.
// 기본값: yes
item_flooritem_check: yes

// BindOnEquip 플래그가 있는 아이템이 장착될 때 기본 바인드 유형을 설정합니다 (db/[pre-]re/item_db.yml 참조)
// 0 - 없음
// 1 - 계정
// 2 - 길드
// 3 - 파티
// 4 - 캐릭터
default_bind_on_equip: 4

// 바인드/판매 제한 아이템을 Itemshop 화폐로 판매할 수 있습니까? (참고 3)
// 0x0 = 바인드/판매 제한 아이템은 Itemshops/상점에 판매할 수 없음
// 0x1 = 바인드 아이템을 Itemshops에 판매할 수 있음
// 0x2 = 판매 제한 아이템을 Itemshops에 판매할 수 있음
// 0x4 = 바인드 아이템을 상점에 판매할 수 있음,
//       대부분의 거래 제한 아이템은 여전히 상점에 판매할 수 있기 때문
// 0x8 = 길드 리더만 BOUND_GUILD 아이템을 상점 또는 Itemshops에 판매할 수 있음 (0x1 또는 0x4 설정된 경우)
allow_bound_sell: 0x0

// 플레이어가 특별 방송 플래그가 있는 아이템을 얻었거나 방송 플래그가 있는 레벨에서 아이템을 정제했을 때 플레이어 이름의 마지막 n 문자를 별표(*)로 숨깁니까?
// 참고: 이 설정 값이 높으면 짧은 이름의 플레이어는 완전히 별표로 변환될 수 있습니다.
broadcast_hide_name: 2

// 임대 아이템을 NPC 상점에 판매할 수 있습니까? (참고 1)
rental_transaction: yes

// item_db의 아이템 값과 관계없이 임대 아이템을 NPC 상점에 0으로 판매합니까? (참고 1)
rental_item_novalue: no

// 일반 상점에서 아이템의 최소 구매 가격
// 공식적으로 아이템은 1 제니 이하로 구매할 수 없습니다.
min_shop_buy: 1

// 일반 상점에서 아이템의 최소 판매 가격
// 공식적으로 아이템은 0 제니에 판매할 수 있습니다.
min_shop_sell: 0

// 속성/종족에서 피해를 줄이는 아이템이 모든 몬스터 피해를 물리적 피해로 간주합니까? (참고 1)
// 공식적으로 "아스프리카" (신 아이템)는 물리적 피해만이 아닌 모든 몬스터 피해를 줄입니다.
// 샤먼 모자는 몬스터 피해를 전혀 줄이지 않으며 (PVP에서 마법 피해를 줄임)
// 이는 bonus3 bSubEle 및 bonus3 bSubRace가 있는 아이템에만 영향을 미칩니다.
cardfix_monster_physical: yes
