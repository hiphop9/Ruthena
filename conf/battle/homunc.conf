//--------------------------------------------------------------
// rAthena 전투 설정 파일
// 원래 번역: Peter Kieser <pfak@telus.net>
// 간단한 영어로 변경: Ancyker
//--------------------------------------------------------------
// 주의 1: 값은 설정 스위치 (on/off, yes/no 또는 1/0)
// 주의 2: 값은 백분율 (100은 100%를 의미합니다)
// 주의 3: 값은 비트 필드입니다. 설명이 없는 경우,
//         단위 유형을 가정합니다 (1: Pc, 2: Mob, 4: Pet, 8: Homun, 16: Mercenary, 128: NPC, 512: Elemental)
//--------------------------------------------------------------

// 호문쿨러스 설정 (참고 3)
// 호문쿨러스를 정상 캐릭터와 다르게 행동하도록 만드는 다양한 '버그'를 활성화합니다.
// 0x01: 지원 스킬의 대상이 될 수 없음 (주인을 제외한)
// 0x04: 공격받기 전까지 몹이 항상 플레이어 대신 호문쿨러스를 추적함
// 0x08: 스폰/맵 변경 시 주인의 속도를 복사
// 0x10: 스탯 창에 실제 크리티컬 대신 luk/3+1을 표시 (기본적으로 크리티컬 없음)
// 0x20: Min-Matk가 항상 Max와 동일함
// 0x40: 기화되면 스킬 재사용 대기시간이 초기화됨
// 0x80: 플레이어와 함께 스킬 또는 아이템으로 워프되면 스킬 재사용 대기시간이 초기화됨
hom_setting: 0x3D

// 호문쿨러스를 먹이로 친밀도를 높이는 비율 (참고 2)
homunculus_friendly_rate: 100

// 호문쿨러스의 이름을 여러 번 변경할 수 있습니까? (참고 1)
hom_rename: no

// 호문쿨러스 진화를 위해 필요한 최소 친밀도
homunculus_evo_intimacy_need: 91100

// 진화 후 친밀도를 재설정할 값
homunculus_evo_intimacy_reset: 1000

// 진화된 바닐미르스의 바이오 폭발을 사용하기 위해 필요한 친밀도
hvan_explosion_intimate: 45000

// 호문쿨러스가 레벨업할 때 주인에게 스탯 성장을 표시합니까?
homunculus_show_growth: yes

// 호문쿨러스가 몬스터를 단독으로 죽였을 때 자동 습득이 작동합니까?
homunculus_autoloot: no

// 주인이 사망하면 호문쿨러스가 자동으로 기화됩니까? (참고 2)
// HP가 80% 미만이면 호문쿨러스는 기화되지 않습니다.
homunculus_auto_vapor: 80

// 일반 호문쿨러스의 최대 레벨
homunculus_max_level: 99

// 호문쿨러스 S의 최대 레벨
homunculus_S_max_level: 250

// 호문쿨러스 S의 성장 레벨
// 이 레벨에서 호문쿨러스 S는 성장 테이블을 사용할 수 있습니다.
// 이 값이 없으면 셔플로 인해 호문쿨러스 S의 모든 레벨이 성장 테이블을 사용하게 되어 불균형한 스탯이 발생합니다.
homunculus_S_growth_level: 99

// 자동 먹이주기 알림을 항상 보냅니까? (참고 1)
// 공식: yes
homunculus_autofeed_always: yes

// 주인이 유휴 상태일 때 호문쿨러스의 경험치/아이템 획득이 비활성화됩니까?
// 아니오로 설정하거나 유휴 상태로 간주되기 전까지 필요한 시간 (밀리초가 아닌 초)을 설정하십시오.
// 채팅/벤딩 중인 캐릭터는 항상 유휴 상태로 간주됩니다.
// 캐릭터의 유휴 상태는 아이템 사용/스킬 사용/공격 (자동 공격도 포함)/이동 시 재설정됩니다.
// 'homunculus_autoloot'이 활성화된 경우에만 주인이 아이템을 받으며,
// 그렇지 않으면 일반적으로 아이템이 바닥에 떨어집니다.
// 참고: 이 옵션은 일반 유휴 타이머와 분리된 특수 타이머를 사용하여 유휴 시간을 추적합니다.
hom_idle_no_share: no

// 서버가 호문쿨러스 주인의 유휴 시간을 측정하는 방법은? (호문쿨러스 경험치 공유 및 자동 습득 전용) (참고 3)
// ('hom_idle_no_share'가 활성화된 경우에만 작동합니다).
// 0x001 - 걷기 요청
// 0x002 - ID로 스킬 사용 요청 (대상 지정 스킬 사용 시도)
// 0x004 - 위치로 스킬 사용 요청 (AoE 스킬 사용 시도)
// 0x008 - 아이템 사용 요청 (장비 착용/해제 포함)
// 0x010 - 공격 요청
// 0x020 - 채팅 요청 (귓속말, 파티, 길드, 전장 등)
// 0x040 - 앉기/일어서기 요청
// 0x080 - 감정 표현 요청
// 0x100 - 아이템 드랍 요청
// 0x200 - @/#명령어 요청
// 최소한 하나의 옵션이 활성화되어야 합니다.
// 옵션이 많을수록 이 기능을 속이기 쉬워집니다.
// 기본값: 걷기 (0x1) + ID로 스킬 사용 (0x2) + 위치로 스킬 사용 (0x4) + 아이템 사용 (0x8) + 공격 (0x10) = 0x1F
// 참고: 이는 호문쿨러스에 대해 일반 유휴 타이머 및 'idletime_option'과 분리된 설정을 구성할 수 있게 합니다.
// 호문쿨러스만 죽이는 경우에만 적용되며, 일반 자동 습득 및 파티 공유 옵션에는 영향을 미치지 않습니다.
idletime_hom_option: 0x1F

// 호문쿨러스가 킬로부터 경험치를 얻는 비율 (참고 2)
// 리뉴얼 모드에만 적용됩니다.
// 공식: 10%
homunculus_exp_gain: 10

// 호문쿨러스의 배고픔 지연이 변경되는 배고픔 비율 (참고 2)
// 'homunculus_starving_delay'에서 지연 값을 참조하십시오.
// 비활성화하려면 0으로 설정하십시오.
// 공식: 10
homunculus_starving_rate: 10

// 호문쿨러스는 일반적으로 60초마다 배고픔이 감소하지만 'homunculus_starving_rate'가 충족되면 배고픔 지연이 20초로 감소합니다 (밀리초 단위).
// 공식: 20초
homunculus_starving_delay: 20000
