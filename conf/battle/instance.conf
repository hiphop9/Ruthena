// 인스턴스가 활성 상태일 때 파티, 길드 또는 클랜을 떠나는 것을 차단합니까?
// 기본값: yes (공식)
instance_block_leave: yes

// 인스턴스가 활성 상태일 때 파티 또는 길드의 리더 변경을 차단합니까?
// 기본값: yes (공식)
instance_block_leaderchange: yes

// 인스턴스가 활성 상태일 때 파티 또는 길드 초대를 차단합니까?
// 이는 인스턴스가 실행 중인 파티, 길드 또는 클랜에 가입하는 것도 차단합니다.
// 기본값: yes (공식)
instance_block_invite: yes

// 인스턴스가 활성 상태일 때 파티 또는 길드에서 추방을 차단합니까?
// 기본값: yes (공식)
instance_block_expulsion: yes
