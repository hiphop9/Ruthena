//--------------------------------------------------------------
// rAthena 전투 설정 파일
// 원래 번역: Peter Kieser <pfak@telus.net>
// 간단한 영어로 변경: Ancyker
//--------------------------------------------------------------
// 주의 1: 값은 설정 스위치 (on/off, yes/no 또는 1/0)
// 주의 2: 값은 백분율 (100은 100%를 의미합니다)
//--------------------------------------------------------------

// 누군가가 훔치기 (gank/steal 스킬) 하면 파티에서 이름을 표시합니까? (참고 1)
show_steal_in_same_party: no

// 파티 멤버의 미니 맵 점을 업데이트하는 간격 (밀리초)
party_update_interval: 1000

// 파티원 HP 바를 업데이트하는 방법:
// 0: Aegis - HP가 변경될 때마다 바가 업데이트됨 (대역폭 집약적)
// 1: rAthena - 파티 맵 점과 함께 바가 업데이트됨 (최대 1초 지연)
party_hp_mode: 0

// 참고:
// 파티 내에서 공유 가능한 레벨 범위는 conf/inter_athena.conf에 설정됩니다.
// "party_share_level" 값 아래에 있습니다.

// '파티 공유' 아이템 공유가 파티에서 활성화될 때,
// 파티원에게 아이템을 받은 사람과 받은 아이템을 알립니까? (참고 1)
show_party_share_picker: yes

// 'show_party_share_picker'가 활성화된 경우 어떤 유형의 아이템을 알릴 것인지 지정합니다.
// 1: IT_HEALING, 2: IT_UNKNOWN, 4: IT_USABLE, 8: IT_ETC,
// 16: IT_WEAPON, 32: IT_ARMOR, 64: IT_CARD, 128: IT_PETEGG,
// 256: IT_PETARMOR, 512: IT_UNKNOWN2, 1024: IT_AMMO, 2048: IT_DELAYCONSUME
// 262144: IT_CASH
show_picker.item_type: 112

// 파티에서 아이템 파티 공유가 활성화된 경우의 분배 방법:
//
// 0: 일반 (아이템이 무작위 파티원에게 갑니다)
// 1: 비몹 드롭에 대해 아이템 공유가 비활성화됨 (플레이어/펫 드롭)
// 2: 라운드 로빈 (아이템이 균등하게 순서대로 멤버에게 분배됨)
// 3: 1+2
party_item_share_type: 0

// 파티의 유휴 멤버에 대해 경험치/아이템 공유가 비활성화됩니까?
// 아니오로 설정하거나 유휴 상태로 간주하기 전에 경과해야 하는 초 (밀리초 아님)를 설정합니다.
// 채팅/벤딩 중인 캐릭터는 항상 유휴 상태로 간주됩니다.
// 캐릭터의 유휴 상태는 아이템 사용/스킬 사용/공격 (자동 공격 포함)/이동 시 재설정됩니다.
idle_no_share: no

// 균등 분배 파티에서 참여한 파티원당 추가 경험치 보너스를 제공합니까? (자신 제외)
// 예: 10으로 설정된 경우, 5명의 균등 분배 파티는 +40% 경험치를 받습니다 (4명 * 10% 경험치):
// 총 140% 파티 경험치, 따라서 각 멤버는 140%/5 = 28% 경험치를 받습니다 (20% 대신).
party_even_share_bonus: 0

// 플레이어가 길드에 있는지 여부와 관계없이 파티 이름을 표시합니까.
// 공식 서버는 사용자가 길드에 있지 않으면 파티 이름을 표시하지 않습니다. (참고 1)
display_party_name: no

// 동일 계정의 여러 캐릭터가 동일 파티에 가입하지 못하도록 합니다. (참고 1)
block_account_in_same_party: yes

// 지정된 플레이어가 동일한 맵에 있지 않으면 파티 리더를 변경하지 못하게 합니다. (참고 1)
change_party_leader_samemap: yes
