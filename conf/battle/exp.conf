//--------------------------------------------------------------
// rAthena 전투 설정 파일
// 원래 번역: Peter Kieser <pfak@telus.net>
// 간단한 영어로 변경: Ancyker
//--------------------------------------------------------------
// 주의 1: 값은 설정 스위치 (on/off, yes/no 또는 1/0)
// 주의 2: 값은 백분율 (100은 100%를 의미합니다)
// 주의 3: 클래스의 최대 레벨은 경험치 테이블에 저장됩니다.
//         변경하려면 db/exp.txt와 db/exp2.txt 파일을 참조하십시오.
//--------------------------------------------------------------

// 경험치가 주어지는 비율. (참고 2)
base_exp_rate: 100

// 직업 경험치가 주어지는 비율. (참고 2)
job_exp_rate: 100

// 플레이어가 한 번의 킬로 여러 번 레벨업할 수 있도록 허용합니까? (참고 1)
multi_level_up: no

// 특정 레벨까지 멀티 레벨업을 허용합니까?
// 이 옵션은 multi_level_up이 활성화된 경우에만 작동합니다.
// 기본값: 0 (제한 없음)
multi_level_up_base: 0
multi_level_up_job: 0

// 설정하면 특정 %의 현재 경험치 막대에 해당하는 최대 경험치를 킬당 얻을 수 있습니다.
// 예를 들어, 500으로 설정하면 몹이 주는 경험치가 많더라도 현재 경험치 막대의 절반 이상을 얻을 수 없습니다.
max_exp_gain_rate: 0

// 몬스터를 처치했을 때 획득한 경험치를 계산하는 방법:
// 0 = 주어진 피해량 / 총 피해량을 사용하여 피해 비율을 계산
// 1 = 주어진 피해량 / 최대 HP를 사용하여 피해 비율을 계산
// 2 = 0 + 첫 번째 공격자가 두 번 계산됨
exp_calc_type: 0

// 공격자 당 경험치 증가 비율. 즉, 몬스터에 대한 추가 공격자마다 이만큼 더 많은 경험치를 줍니다.
// (예: 25로 설정하고 5명이 공격하면 +(25*4)% -> +100% 경험치)
exp_bonus_attacker: 25

// 경험치 보너스가 제한되는 최대 공격자 수
// (예: 5로 설정하면 최대 보너스는 공격자 수와 관계없이 4*캐릭터당 보너스)
exp_bonus_max_attacker: 12

// MVP 보너스 경험치 비율. (참고 2)
mvp_exp_rate: 100

// NPC가 주는 기본/직업 경험치 비율. (참고 2)
quest_exp_rate: 100

// 힐 스킬을 사용할 때 주는 직업 경험치 비율 (100은 힐 양과 동일, 200은 두 배)
// 경험치 비율의 균형은 5에서 10 사이가 가장 좋습니다.
heal_exp: 0

// 부활 과정에서 얻는 경험치 비율, 단위는 0.01%입니다.
// 부활한 플레이어가 가진 경험치 값을 기준으로 부활된 사람의 레벨 차이에 따라 경험치를 얻을 수 있습니다.
// 경험치 계산은 (경험치 값 * 부활된 사람의 레벨 차이) / 100 * resurrection_exp/10000입니다.
resurrection_exp: 0

// NPC에서 할인 및 과금 사용 시 주는 직업 경험치 비율
// (0.01% 단위 - 100은 1%, 10000은 정상, 20000은 두 배)
// 계산 방식은 (받은 돈 * 스킬 레벨) * shop_exp / 10000입니다.
shop_exp: 0

// PvP 맵에서 플레이어가 경험치를 얻습니까?
// (참고: 플레이어로부터 경험치를 얻는 것이 아니라 일반 레벨업 경험치를 얻는 것입니다)
pvp_exp: yes

// 플레이어가 죽었을 때, 어떻게 페널티를 부여해야 합니까?
// 0 = 페널티 없음.
// 1 = 사망 시 현재 레벨의 %를 잃습니다.
// 2 = 사망 시 총 경험치의 %를 잃습니다.
death_penalty_type: 1

// 기본 경험치 페널티 비율 (각 100은 경험치의 1%입니다)
death_penalty_base: 100

// 직업 경험치 페널티 비율 (각 100은 경험치의 1%입니다)
death_penalty_job: 100

// 플레이어가 사망했을 때 (다른 플레이어에 의해), 얼마나 많은 제니를 페널티로 부과합니까?
// 참고: 이는 제니의 백분율이며, 100 = 1%입니다.
zeny_penalty: 0

// 최대 기본/직업 레벨의 플레이어가 사망 시 경험치를 잃습니까?
// 0: 절대 잃지 않음 (공식 서버와 동일).
// 1: 기본 경험치 손실.
// 2: 직업 경험치 손실.
death_penalty_maxlv: 0

// 몬스터를 죽였을 때 획득한 경험치를 표시합니까? (참고 1)
disp_experience: no

// 획득한 제니를 표시합니까 (몹, 거래 등으로부터) (참고 1)
disp_zeny: no

// 스탯 초기화 및 레벨업 시 db/statpoint.txt의 내용을 사용합니까? (참고 1)
// 아니오로 설정하면 외부 수단으로 얻거나 잃은 스탯 포인트를 보존하는 방정식을 사용합니다
// (예: 스탯 포인트 구매/판매자).
use_statpoint_table: yes

// 스탯 초기화 및 레벨업 시 db/statpoint.yml의 내용을 사용합니까? (참고 1)
// 아니오로 설정하면 외부 수단으로 얻거나 잃은 특성 포인트를 보존하는 방정식을 사용합니다
// (예: 특성 포인트 구매/판매자).
use_traitpoint_table: yes

// PR_REDEMPTIO 시전 시 경험치 비용 (참고 2)
exp_cost_redemptio: 1

// PR_REDEMPTIO의 경험치 페널티가 0이 되는 데 필요한 플레이어 수는 몇 명입니까?
// 기본적으로 'exp_cost_redemptio'가 1 (1%)이고, 부활된 플레이어당 페널티가 0.2%로 감소하는 경우,
// 'exp_cost_redemptio_limit'는 5입니다.
exp_cost_redemptio_limit: 5
