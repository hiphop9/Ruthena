//--------------------------------------------------------------
// rAthena 전투 설정 파일
// 원래 번역: Peter Kieser <pfak@telus.net>
// 간단한 영어로 변경: Ancyker
//--------------------------------------------------------------
// 주의 1: 값은 설정 스위치 (on/off, yes/no 또는 1/0)
// 주의 2: 값은 백분율 (100은 100%를 의미합니다)
// 주의 3: 값은 비트 필드입니다. 설명이 없는 경우,
//         단위 유형을 가정합니다 (1: Pc, 2: Mob, 4: Pet, 8: Homun, 16: Mercenary)
//--------------------------------------------------------------

// 귓속말/전체/파티/길드 메시지 간 최소 지연 시간 (밀리초)
// 이 임계값을 초과하는 메시지는 조용히 생략됩니다.
min_chat_delay: 0

// 클라이언트에서 유효한 염색 및 스타일 범위.
min_hair_style: 0
max_hair_style: 42
min_hair_color: 0
max_hair_color: 8
min_cloth_color: 0 
max_cloth_color: 7
// must be max possible job id
max_body_style: 4349

// 예로 설정되면, WOE 맵에서 전송된 패킷의 피해 필드는 -1로 설정되어,
// GM, 봇 및 변조된 클라이언트가 실제 피해를 알 수 없게 됩니다. (참고 1)
hide_woe_damage: no

// "헤어 스타일" 번호가 애완 동물을 식별합니다.
// 참고: 클라이언트는 몹 패킷의 "헤어 스타일" 필드를 사용하여 이를 몹과 구분합니다.
// 이 값은 해당 클라이언트에서 사용할 수 있는 최대 헤어 스타일보다 항상 높습니다.
// 작동하는 알려진 값 (모든 2005 클라이언트):
// 구형 sakexe: 20
// sakexe 0614: 24
// sakexe 0628 (및 이후): 100
pet_hair_style: 100

// 가시적 영역 크기 (플레이어가 볼 수 있는 거리)
area_size: 14

// 최대 이동 경로 (플레이어가 커서를 향해 걸을 수 있는 거리)
max_walk_path: 17

// 유닛 패킷에서 전송할 수 있는 최대 '레벨' 값.
// aura_lv 설정과 함께 사용하여 언제 오라를 표시할지 결정합니다.
// 참고: 이 작업을 하려면 클라이언트도 조정해야 합니다.
// 참고: 기본값은 99입니다. 127 이상의 값은 잘못 작동할 가능성이 있습니다.
// 참고: 이 설정이 무엇을 하는지 모르면 변경하지 마십시오!!!
max_lv: 99

// 오라를 표시하기 위해 필요한 레벨.
// 참고: 클라이언트에 max_lv를 보내면 오라가 표시된다고 가정합니다.
// 참고: aura_lv는 max_lv보다 작아서는 안 됩니다.
// 예: max_lv가 99이고 aura_lv가 150이면, 레벨 99~149의 캐릭터는 모두 레벨 98로 보내지고,
//      레벨 150 이상의 캐릭터만 레벨 99로 보고되어 오라를 표시합니다.
aura_lv: 99

// max_lv 및 aura_lv 설정에 영향을 받는 유닛 유형. (참고 3)
// 참고: 일반적으로 오라를 표시하지 않는 유닛 유형이 설정된 경우,
//       레벨 요구 사항을 충족하면 오라를 획득합니다.
// 기본값: 0 (없음)
client_limit_unit_lv: 0

// 턱시도와 웨딩 드레스를 착용했을 때 표시되나요? (참고 1)
wedding_modifydisplay: no

// 옷 색상을 저장합니다. (성능이 저하됩니다) (참고 1)
save_clothcolor: yes

// 바디 스타일을 저장합니다. (참고 1)
save_body_style: yes

// 웨딩 클래스에 대해 옷 색상을 표시하지 않나요?
// 참고: 이 옵션이 적용되려면 save_clothcolor와 wedding_modifydisplay가 모두 활성화되어야 합니다.
// 의상 팔레트 팩에 웨딩 팔레트가 없거나 다른 직업보다 적은 경우 예로 설정하십시오.
wedding_ignorepalette: no

// 크리스마스 의상에 대해 옷 색상을 표시하지 않나요?
// 의상 팔레트 팩에 크리스마스 팔레트가 없거나 다른 직업보다 적은 경우 예로 설정하십시오.
xmas_ignorepalette: no

// 여름 의상에 대해 옷 색상을 표시하지 않나요?
// 의상 팔레트 팩에 여름 팔레트가 없거나 다른 직업보다 적은 경우 예로 설정하십시오.
summer_ignorepalette: no

// 한복 의상에 대해 옷 색상을 표시하지 않나요?
// 의상 팔레트 팩에 한복 팔레트가 없거나 다른 직업보다 적은 경우 예로 설정하십시오.
hanbok_ignorepalette: no

// 옥토버페스트 의상에 대해 옷 색상을 표시하지 않나요?
// 의상 팔레트 팩에 옥토버페스트 팔레트가 없거나 다른 직업보다 적은 경우 예로 설정하십시오.
oktoberfest_ignorepalette: no

// 클라이언트가 langtype 문제로 motd를 제대로 표시할 수 없는 경우 1로 설정하십시오.
motd_type: 0

// 로그인 시 사용자에게 rAthena 버전을 표시하나요?
display_version: yes

// "환각" 상태 효과를 받았을 때, 클라이언트에 효과를 보내나요? (참고 1)
// 참고: 클라이언트가 "물결" 화면 효과로 인해 지연되는 경우 '아니오'로 설정하십시오.
display_hallucination: yes

// 클라이언트가 상태 변경 타이머를 지원하고 이를 사용하려는 경우 1로 설정하십시오.
// 2009년 이후의 클라이언트가 이를 지원합니다.
display_status_timers: yes

// 주사위 이모티콘을 서버 측에서 무작위로 설정하여 클라이언트가 원하는 숫자로 패킷을 위조하지 못하도록 합니다. (참고 1)
client_reshuffle_dice: yes

// 캐릭터 및 길드 창고를 클라이언트에 보내기 전에 정렬합니까?
// 공식 서버는 창고를 정렬하지 않습니다. (참고 1)
// 참고: 이 옵션을 활성화하면 성능이 저하됩니다.
client_sort_storage: no

// 은신 상태에서 적의 위치를 업데이트합니까? (참고 1)
// 참고: '아니오'로 설정하면 클라이언트는 플레이어가 "Intravision" 효과를 가지지 않는 한 적의 위치를 업데이트하지 않습니다.
//       이는 클라이언트가 WPE - 마야 퍼플 해킹 관련 문제를 처리하는 데 도움이 됩니다.
//       그러나 플레이어가 은신 상태일 때 게임 애니메이션 표시가 엉망이 됩니다.
update_enemy_position: yes

// 플레이어가 텔레포트하거나, 맵을 변경하거나, 로그인할 때, 이전에 바라보고 있던 방향을 유지합니까?
// 공식: 비활성화, 플레이어는 항상 북쪽을 향합니다.
spawn_direction: no

// 클라이언트 2013-12-23cRagexe 및 이후 버전에서 MVP EXP 보상 메시지를 표시합니까? (참고 1)
// kRO는 이 패킷을 제거했으며, 이 메시지를 다시 활성화합니다.
// 공식: 비활성화.
mvp_exp_reward_message: no

// 핑 타이머 전송
// 각 타이머 호출 간격 (초 단위).
ping_timer_inverval: 30

// 핑 패킷을 전송하기 전에 패킷 전송 시간 초과 (초 단위).
ping_time: 20

// 클라이언트 2015-12-23 및 이후 버전에서 스킬 스케일을 표시합니까? (참고 1)
// 공식: 예
show_skill_scale: yes

// 플레이어의 연결 해제 요청을 받은 후 서버 측에서 연결을 끊어야 하나요? (참고 1)
// 참고: 이를 활성화하면 REST API 호출을 사용하는 클라이언트에서 문제가 발생할 수 있습니다.
// 공식: 아니오
drop_connection_on_quit: no

// 매크로 탐지기 재시도
// 매크로 탐지에서 실패할 수 있는 횟수입니다.
// 공식: 3 (최소: 1)
macro_detection_retry: 3

// 매크로 탐지기 시간 초과
// 매크로 탐지가 실패하기 전에 경과하는 시간 (밀리초 단위)입니다.
// 공식: 60000
macro_detection_timeout: 60000

// 매크로 탐지기 처벌 유형
// 0 - 밴
// 1 - 감옥
// 공식: 0
macro_detection_punishment: 0

// 매크로 탐지기 처벌 시간
// 처벌 유형이 활성화되는 시간 (분 단위)입니다. 무한대로 설정하려면 0을 사용하십시오.
// 공식: 0
macro_detection_punishment_time: 0
