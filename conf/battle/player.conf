//--------------------------------------------------------------
// rAthena 전투 설정 파일
// 원래 번역: Peter Kieser <pfak@telus.net>
// 간단한 영어로 변경: Ancyker
//--------------------------------------------------------------
// 주의 1: 값은 설정 스위치 (on/off, yes/no 또는 1/0)
// 주의 2: 값은 백분율 (100은 100%를 의미합니다)
// 주의 3: 값은 비트 필드입니다. 설명이 없으면 기본적으로 단위 유형을 가정합니다 (1: Pc, 2: Mob, 4: Pet, 8: Homun, 16: Mercenary, 128: NPC, 512: Elemental)
//--------------------------------------------------------------

// 플레이어의 최대 HP 비율? (기본값은 100)
hp_rate: 100

// 플레이어의 최대 SP 비율? (기본값은 100)
sp_rate: 100

// 왼손의 카드 및 속성 효과가 오른손 공격에 적용됩니까? (참고 1)
// (공식 서버에서는 'yes'입니다)
left_cardfix_to_right: yes

// 플레이어가 부활할 때 HP를 얼마나 가질 것인가, 0은 기본값.
// (단위는 전체 HP의 백분율, 100은 HP를 완전히 회복, 0은 1HP로 부활.)
restart_hp_rate: 0

// 플레이어가 부활할 때 SP를 얼마나 가질 것인가, 0은 기본값.
// (단위는 전체 SP의 백분율, 100은 SP를 완전히 회복, 0은 1SP로 부활.)
restart_sp_rate: 0

// 일반 플레이어가 스킬 트리를 무시할 수 있습니까? (참고 1)
player_skillfree: no

// 'yes'로 설정하면 1차 직업에서 얻은 스킬 포인트를 1차 직업 스킬에만 사용하도록 강제하고, 초보자 스킬 포인트를 기본 스킬에만 사용하도록 강제합니다. (참고 1)
player_skillup_limit: yes

// 퀘스트 스킬을 배울 수 있습니까? (참고 1)
// 이 설정을 'yes'로 하면 서버에서 악용될 수 있습니다!
quest_skill_learn: no

// 스킬이 초기화될 때 퀘스트 스킬도 초기화됩니까? (참고 1)
// 이 설정을 'yes'로 하면 서버에서 악용될 수 있습니다!
// 참고: quest_skill_learn을 'yes'로 설정하면 퀘스트 스킬은 항상 초기화됩니다.
quest_skill_reset: no

// 앉기, 거래, 파티 구성 또는 채팅방 만들기 위해 기본 스킬이 필요합니까? (참고 1)
basic_skill_check: yes

// 텔레포트하거나 맵에 스폰될 때, 움직이지 않으면 몬스터가 당신을 발견하기까지 얼마나 걸립니까? (시간은 밀리초 단위)
// 즉, 맵에 가만히 있을 때 몬스터가 당신을 발견하기까지 얼마나 걸립니다.
// 몬스터를 공격하면 이 설정에 관계없이 몬스터는 반격합니다.
player_invincible_time: 5000

// HP가 자연스럽게 회복되는 시간 간격 (밀리초 단위)
natural_healhp_interval: 6000

// SP가 자연스럽게 회복되는 시간 간격 (밀리초 단위)
natural_healsp_interval: 8000

// 자동 치유 스킬의 시간 간격 (밀리초 단위)
natural_heal_skill_interval: 10000

// 캐릭터가 자연적으로 치유를 멈추는 최대 무게 (백분율 단위)
// 리뉴얼: 클라이언트 20171025 이상 필요
natural_heal_weight_rate: 50
natural_heal_weight_rate_renewal: 70

// 최대 공격 속도 (기본값 190, 최대 허용값 199)
max_aspd: 190

// 3차 직업의 최대 공격 속도 (기본값 193, 최대 허용값 199)
max_third_aspd: 193

// 확장 클래스 (Kagerou/Oboro 및 Rebellion)의 최대 공격 속도 (기본값 193, 최대 허용값 199)
max_extended_aspd: 193

// 소환사 클래스 (Doram)의 최대 공격 속도 (기본값 193, 최대 허용값 199)
max_summoner_aspd: 193

// 최대 걷기 속도 비율 (200은 정상 속도의 두 배에 해당)
max_walk_speed: 300

// 레벨에 따른 최대 HP. 기본값:
// Lv 99:  330000
// Lv150:  660000
// Lv175: 1100000
max_hp_lv99: 330000
max_hp_lv150: 660000
max_hp: 1100000

// 최대 SP. (기본값은 1000000)
max_sp: 1000000

// 각 클래스의 최대 파라미터/스탯 (str, agi, vit, int, dex, luk)
// 'max_parameter'는 초보자, 일반 클래스, 비아기, 비3차 클래스에 해당
// 'max_trans_parameter'는 전직 클래스 (비3차 전직 클래스)에 해당
// 'max_third_parameter'는 3차 클래스 (일반/전직 제외) 단, 아기 3차 클래스는 제외
// 'max_third_trans_parameter'는 3차 전직 클래스에 해당
// 'max_baby_parameter'는 아기 클래스 단, 아기 3차 클래스는 제외
// 'max_baby_third_parameter'는 아기 3차 클래스에만 해당
// 'max_extended_parameter'는 확장 2차 클래스 (Kagerou/Oboro 및 Rebellion)에 해당
// 더 구체적인/고급 옵션은 'db/[pre-]re/job_params_db.txt'를 참조하십시오.
max_parameter: 99
max_trans_parameter: 99
max_third_parameter: 130
max_third_trans_parameter: 130
max_baby_parameter: 80
max_baby_third_parameter: 117
max_extended_parameter: 125
max_summoner_parameter: 120
max_fourth_parameter: 130

// 전직 클래스의 스탯 보너스
transcendent_status_points: 52

// 최대 방어력 및 마법 방어력
// 참고: 이 설정은 서버가 리뉴얼 모드 (RENEWAL)로 실행되는 경우 영향을 미치지 않습니다.
// 참고: 스킬 및 상태 효과 (예: 정신력)에는 영향을 미치지 않습니다.
// weapon_defense_type이 0이 아닌 경우, 최대 방어력에 적용되지 않습니다.
// magic_defense_type이 0이 아닌 경우, 최대 마법 방어력에 적용되지 않습니다.
max_def: 99

// 방어력을 방어력2로 변환하는 보너스. 방어력이 max_def를 초과하면 남은 방어력이 이 배수를 사용하여 vit 방어력/int 마법 방어력으로 변환됩니다.
// (예: 10으로 설정된 경우, 최대치를 초과하는 모든 방어력 포인트는 10 vit 방어력 포인트가 됩니다)
over_def_bonus: 0

// 카트의 최대 무게
max_cart_weight: 8000

// 타격 후 플레이어가 로그아웃을 방지하는 시간 (밀리초 단위, 0은 비활성화)?
prevent_logout: 10000

// 서버가 플레이어의 로그아웃을 방지해야 할 때는? prevent_logout이 비활성화된 경우에는 영향을 미치지 않습니다. (참고 3)
// 공식 서버는 플레이어가 공격, 스킬 사용, 피해를 입은 후 로그아웃을 방지합니다.
// 0 = 플레이어가 항상 로그아웃할 수 있음
// 1 = 로그인 후 로그아웃 방지
// 2 = 공격 후 로그아웃 방지
// 4 = 스킬 사용 후 로그아웃 방지
// 8 = 타격 후 로그아웃 방지
prevent_logout_trigger: 14

// 일반 공격으로 HP/SP가 소모되는 값을 표시합니까? (예: Hunter Fly 카드)
show_hp_sp_drain: no

// 몬스터를 처치하여 획득한 HP/SP 값을 표시합니까? (예: Sky Deleter 카드)
show_hp_sp_gain: yes

// A가 B를 친구로 받아들일 때 B도 A의 친구 목록에 자동으로 추가됩니까? 그렇지 않으면 A만 B의 친구 목록에 나타납니다.
// 참고: 이 설정은 친구 자동 추가 및 자동 삭제를 활성화합니다.
friend_auto_add: yes

// 동시 초대 요청 (거래/파티/길드)이 자동으로 거부됩니까?
invite_request_check: yes

// 플레이어가 죽을 때 'Skull'을 떨어뜨립니까?
// 참고: 'Skull' 아이템 (ID 7420)은 기본적으로 거래 제한이 있습니다. 이 기능이 작동하려면 아이템의 "NoTrade" 플래그를 제거해야 합니다.
// 0 = 비활성화
// 1 = PvP 맵에서만 떨어짐
// 2 = 모든 상황에서 떨어짐
bone_drop: 0

// 말을 탄 (Peco에 탄) 캐릭터가 크기가 커지나요?
// 0 = 아니요
// 1 = 일반 클래스만 Peco에 탄 경우 큰 크기
// 2 = 아기 클래스만 Peco에 탄 경우 중간 크기
// 3 = 일반 클래스는 큰 크기, 아기 클래스는 중간 크기
character_size: 0

// 유휴 상태의 캐릭터가 자동 루팅을 받을 수 있습니까?
// 자동 루팅에서 아이템을 받지 못하게 되는 유휴 상태의 캐릭터 시간 (초 단위, 0은 비활성화).
idle_no_autoloot: 0

// NPC와의 최소 거리에서 벤딩/채팅 방을 설정할 수 있는 최소 거리.
// 기본값: 3 (0은 비활성화).
min_npc_vendchat_distance: 3

// 대여 탈것이 플레이어의 이동 속도를 얼마나 증가시킵니까?
// 기본값은 25입니다. 100 = 100% 증가.
rental_mount_speed_boost: 25

//===================================
// VIP 시스템
//===================================
// 저장 슬롯 증가. 0으로 설정하면 비활성화됩니다.
// MIN_STORAGE 제한을 초과하여 더 많은 저장 슬롯을 제공합니다.
// 참고: MIN_STORAGE + vip_storage_increase는 MAX_STORAGE를 초과할 수 없습니다.
// 기본값: 300
vip_storage_increase: 300

// 기본 경험치 증가 비율. 0으로 설정하면 비활성화됩니다. (참고 2)
// 기본값: 50
vip_base_exp_increase: 50

// 직업 경험치 증가 비율. 0으로 설정하면 비활성화됩니다. (참고 2)
// 기본값: 50
vip_job_exp_increase: 50

// VIP 계정의 경험치 패널티 비율.
// 기본값: 100 (100 = 1% 패널티)
vip_exp_penalty_base: 100
vip_exp_penalty_job: 100

// VIP 계정의 제니 패널티.
// 제니 손실은 플레이어가 다른 플레이어에게 죽었을 때만 발생합니다.
// 기본값: 0 (100 = 1% 패널티)
vip_zeny_penalty: 0

// 전투 매뉴얼 경험치 증가. 0으로 설정하면 비활성화됩니다.
// - 일반/두꺼운 전투 매뉴얼: 50+(50/X) = 75%
// - HE 전투 매뉴얼: 100+(100/X) = 150%
// - 전투 매뉴얼 x3: 200+(200/X) = 300%
// 참고: X는 설정 값입니다.
// 기본값: 2
vip_bm_increase: 2

// 아이템 드롭 증가. 0으로 설정하면 비활성화됩니다.
// 참고: 50 = 50% 아이템 드롭 증가.
// 아이템 비율이 200인 경우: 200 * 50 / 100 = 100 보너스 비율이 200 기본 비율에 추가되어 총 비율 300이 됩니다.
// 기본값: 50
vip_drop_increase: 50

// 보석 요구 사항.
// VIP 그룹이 스킬에 대한 보석 요구 사항을 무시할 수 있습니까?
// 0 = 비활성화
// 1 = 미스트리스 카드처럼 동작
// 2 = 모든 보석 요구 사항 제거 (기본값)
vip_gemstone: 2

// 비율 정보 (경험치, 드롭, 및 죽음 패널티 메시지)를 표시합니까? (참고 1)
vip_disp_rate: yes

// 워프 중에 죽은 플레이어를 부활시킵니까? (참고 1)
revive_onwarp: yes

// 태권 랭커 보너스를 받기 위한 최소 기본 레벨
// - 최대 HP 및 SP의 3배
// - 모든 태권 스킬
taekwon_ranker_min_lv: 90

// 명성 포인트 획득
// 태권 임무 완료
fame_taekwon_mission: 1
// 자신의 제련된 무기를 +10으로 제련
fame_refine_lv1: 1
fame_refine_lv2: 25
fame_refine_lv3: 1000
// 3개의 추가 재료로 lv3 무기 제작 성공
fame_forge: 10
// 제련된 무기를 +10으로 제련하는 경우 포인트 부여
blacksmith_fame_refine_threshold: 10
// 연속으로 'n'개의 응축 포션 제작 성공
fame_pharmacy_3: 1
fame_pharmacy_5: 3
fame_pharmacy_7: 10
fame_pharmacy_10: 50

// 서버가 캐릭터의 유휴 시간을 측정하는 방법 (참고 3)
// 0x0001 - 걷기 요청
// 0x0002 - 스킬 사용 요청 (대상 스킬 사용 시도)
// 0x0004 - 스킬 사용 요청 (AoE 스킬 사용 시도)
// 0x0008 - 아이템 사용 요청 (장비 착용/해제 포함)
// 0x0010 - 공격 요청
// 0x0020 - 채팅 요청 (귓속말, 파티, 길드, 전장 등)
// 0x0040 - 앉기/일어서기 요청
// 0x0080 - 감정 표현 요청
// 0x0100 - 아이템 버리기 요청
// 0x0200 - @/#명령어 요청
// 0x0400 - NPC 창 닫기
// 0x0800 - NPC에게 입력 제공
// 0x1000 - NPC 메뉴 옵션 선택
// 0x2000 - NPC의 다음 버튼 클릭
// 0x4000 - NPC 진행 막대 완료
// 최소한 1개의 옵션이 활성화되어야 합니다.
// 더 많은 옵션을 사용할수록 유휴 시간에 의존하는 기능을 속이는 것이 더 쉬워집니다 (예: checkidle()).
// 기본값: walk (0x1) + useskilltoid (0x2) + useskilltopos (0x4) + useitem (0x8) + attack (0x10) + 모든 NPC 상호작용(0x400,0x800,0x1000,0x2000,0x4000) = 0x7C1F
idletime_option: 0x7C1F

// 소환사 클래스의 특수 특성을 조정합니다.
// - 소환사는 야수 종족 범주에 속합니다. 몬스터 종족 RC_BRUTE (2)와 구별하기 위해 RC_PLAYER_DORAM (11)이라는 고유 종족을 가집니다.
// - 소환사는 중간 크기 (1) 대신 작은 크기 (0)입니다.
summoner_race: 11
summoner_size: 0

//================================
// 4차 직업 시스템
//================================
// 플레이어가 4차 직업으로 변경할 때 얻는 특성 포인트 수
// 기본값: 7
trait_points_job_change: 7

// 최대 특성 스탯 캡.
// 특성 스탯: POW, STA, WIS, SPL, CON, CRT
// 공식은 110입니다.
max_trait_parameter: 110

// 아이템 보너스/스킬로 무시할 수 있는 RES/MRES의 최대 백분율
// 기본값: 50
max_res_mres_ignored: 50

// 최대 AP
// 기본값: 1000
max_ap: 1000

// 플레이어의 최대 AP 비율? (기본값은 100)
ap_rate: 100

// 플레이어가 부활할 때 AP를 얼마나 가질 것인가, 0은 기본값.
// (단위는 전체 AP의 백분율, 100은 AP를 완전히 회복, 0은 0 AP로 부활.)
restart_ap_rate: 0

// 플레이어가 죽을 때 AP가 소모됩니까?
// 기본값: 예
loose_ap_on_death: yes

// 플레이어가 PVP/GVG/WoE/전장 맵에 들어갈 때 AP가 소모됩니까?
// 기본값: 예
loose_ap_on_map: yes

// 플레이어가 로그아웃할 때 AP를 유지합니까?
// 기본값: 예
keep_ap_on_logout: yes
