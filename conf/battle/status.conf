//--------------------------------------------------------------
// rAthena 전투 설정 파일
// 원래 번역: Peter Kieser <pfak@telus.net>
// 더 쉬운 영어로: Ancyker
//--------------------------------------------------------------
// 참고 1: 값은 설정 스위치 (켜기/끄기, 예/아니오, 또는 1/0)
// 참고 2: 값은 퍼센트로 표시됨 (100은 100%를 의미)
// 참고 3: 값은 비트 필드. 설명이 없으면,
//         기본적으로 유닛 유형을 가정함 (1: Pc, 2: Mob, 4: Pet, 8: Homun, 16: Mercenary, 128: NPC, 512: Elemental)
//--------------------------------------------------------------

// 저주/스턴/수면 등 상태 이상(침묵 포함)에 걸릴 때 스킬 시전이 취소되어야 하나요? (참고 3)
status_cast_cancel: 0

// 특정 스킬 상태 변화가 로그아웃 시 제거됩니까?
// 0 = (기본값) SCF_NO_SAVE 플래그가 있는 상태만 제거.
// 1 = 부정적 버프 제거 (디버프로 플래그된 상태)
// 2 = 긍정적 버프 제거.
// 3 = 모두 제거.
debuff_on_logout: 0

// 상태 이상에 대한 자연 저항률 조정.
// 50으로 설정하면 상태 방어가 절반으로 줄어들며, 상태 이상을 차단하기 위해 두 배의 스탯이 필요함 (예: 스턴을 완전히 차단하려면 VIT 200 필요)
pc_status_def_rate: 100
mob_status_def_rate: 100

// 상태 이상에 대한 최대 저항. (100 = 100%)
// 참고: 카드와 장비는 이 한도를 초과할 수 있으므로, 이는 자연 저항에만 적용됩니다.
pc_max_status_def: 100
mob_max_status_def: 100
