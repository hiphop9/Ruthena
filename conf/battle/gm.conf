//--------------------------------------------------------------
// rAthena 전투 설정 파일
// 원래 번역: Peter Kieser <pfak@telus.net>
// 간단한 영어로 변경: Ancyker
//--------------------------------------------------------------
// 주의 1: 값은 설정 스위치 (on/off, yes/no 또는 1/0)
// 주의 2: 값은 백분율 (100은 100%를 의미합니다)
//--------------------------------------------------------------

// 명령어를 인식하는 데 사용할 기호입니다.
// 다음을 제외한 모든 문자를 설정할 수 있습니다:
// - 제어 문자 (0x00-0x1f),
// - '%' (파티 채팅 기호)
// - '$' (길드 채팅 기호)
// - '/' (클라이언트 명령어 기호)
// atcommand_symbol은 로컬에서 사용되는 @명령어를 나타냅니다.
// charcommand_symbol은 다른 플레이어에게 사용되는 #명령어를 나타냅니다.
atcommand_symbol: @
charcommand_symbol: #

// GM 명령어로 소환할 수 있는 최대 몬스터 수 (0은 무제한 수량을 의미)
atcommand_spawn_quantity_limit: 100

// @slaveclone 명령어를 사용하여 생성할 수 있는 최대 노예 클론 수 (0은 무제한 수량을 의미)
atcommand_slave_clone_limit: 25

// 'no'로 설정하면 명령어는 정확한 플레이어 이름을 요구합니다. 'yes'로 설정하면
// 현재 맵 서버의 모든 플레이어 중에서 하나의 일치 항목이 있는 경우 부분 이름 입력이 작동합니다.
// 감옥, 밴 등 몇 가지 중요한 명령어는 여전히 전체 이름을 입력해야 합니다.
// 이 설정이 활성화되면 항상 charcommand에 대해 작동합니다.
partial_name_scan: yes

// 거래 복제를 시도하는 사람을 밴합니다.
// 밴의 지속 시간 (분 단위) (기본값: 5). 밴을 비활성화하려면 0으로 설정하십시오.
ban_hack_trade: 5

// RENEWAL_EXP 또는 RENEWAL_DROP이 활성화되어 있어야 합니다 (src/config/renewal.hpp).
// @mobinfo를 수정하여 renewal_drop 공식에 따라 사용자의 실제 드랍율을 표시합니다.
// @iteminfo를 수정하여 최소 아이템 드랍율을 표시하지 않습니다 (몬스터 레벨을 알 수 없기 때문).
// @whodrops를 수정하여 renewal_drop 공식에 따라 사용자의 실제 드랍율을 표시합니다.
atcommand_mobinfo_type: 1

// 명령어가 NPC의 레벨업 이벤트를 트리거해야 합니까? (참고 1)
// 이 옵션은 @baselevelup 및 @joblevelup에 해당합니다.
// 기본값: no
atcommand_levelup_events: no

// 플레이어가 NPC에 연결되어 있는 동안 명령어를 비활성화합니까? (참고 1)
// 이 설정은 스크립트 명령어 'enable_command' 및 'disable_command'로 변경할 수 있습니다.
// 'conf/group.conf'의 'command_enable' 권한을 가진 사람은 이를 무시할 수 있습니다.
// 기본값: yes
atcommand_disable_npc: yes
