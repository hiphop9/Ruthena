//--------------------------------------------------------------
// rAthena 전투 설정 파일
// 원래 번역: Peter Kieser <pfak@telus.net>
// 간단한 영어로 변경: Ancyker
//--------------------------------------------------------------
// 주의 1: 값은 설정 스위치 (on/off, yes/no 또는 1/0)
// 주의 2: 값은 백분율 (100은 100%를 의미합니다)
//--------------------------------------------------------------

// 길드를 만들 때, 엠페리움을 소모합니까? (참고 1)
guild_emperium_check: yes

// 길드 멤버의 최대 세금 한도.
guild_exp_limit: 50

// 한 길드가 소유할 수 있는 최대 성 수 (0 = 무제한)
guild_max_castles: 0

// 재로그인 시 길드 스킬 지연을 활성화합니까?
// 0 - 쿨다운을 저장하고 재로그인 시 재개.
// 1 - 쿨다운을 저장하지 않고 재로그인 시 타이머를 재시작.
// 공식 서버 기본값: 프리 리뉴얼에서는 1, 리뉴얼에서는 0
//guild_skill_relog_type: 0

// 길드 스킬에 적용되는 지연 시간 (밀리초 단위).
// 공식 설정은 5분 (300000 밀리초)입니다.
// 참고: 리뉴얼에서는 개별 스킬 쿨다운을 선호하여 변경되었습니다.
guild_skill_relog_delay: 300000

// WoE 전투 (길드 대 길드)에서 근접 공격 조정 (비스킬) (참고 2)
gvg_short_attack_damage_rate: 80

// WoE 전투 (길드 대 길드)에서 원거리 공격 조정 (비스킬) (참고 2)
gvg_long_attack_damage_rate: 80

// WoE 전투 (길드 대 길드)에서 무기 스킬 공격 조정 (참고 2)
gvg_weapon_attack_damage_rate: 60

// WoE 전투 (길드 대 길드)에서 마법 스킬 공격 조정 (참고 2)
gvg_magic_attack_damage_rate: 60

// WoE 전투 (길드 대 길드)에서 기타 스킬 공격 조정 (참고 2)
gvg_misc_attack_damage_rate: 60

// GvG 지역에서 플리 페널티. 공식 값은 20입니다 (참고 2)
// 참고: 절대값이 아닌 %, 따라서 20은 총 플리의 -20%입니다.
gvg_flee_penalty: 20

// '길드의 영광' 스킬을 길드 창에서 배울 수 있습니까,
// 그리고 엠블럼 변경에 필요합니까? (참고 1)
// 참고: 이 스킬은 공식 서버에 구현되지 않았습니다.
require_glory_guild: no

// 길드 동맹 제한. 값은 0에서 3 사이입니다.
// 이 값을 변경하려면 길드 동맹 테이블을 비워야 합니다.
// 기본값은 3입니다.
max_guild_alliance: 3

// 길드 공지를 다시 표시할 때
// 텔레포트할 때 (맵 변경 여부와 관계없이): 2 (공식)
// 맵을 변경할 때: 1
// 다시 표시하지 않음: 0 (비활성화)
guild_notice_changemap: 2

// maprespawnguildid가 클론도 죽여야 합니까?
// 기본값: no
guild_maprespawn_clones: no

// 길드 마스터 변경 대기 시간 (분 단위)
// 기본값: 1440 (1일)
// 지연 시간을 비활성화하려면 0분을 사용하십시오.
guild_leaderchange_delay: 1440

// WoE 중에 길드 리더 변경이 허용됩니까?
// 기본값: no
guild_leaderchange_woe: no

// 길드 마스터만 동맹을 수락할 수 있습니까?
// 기본값: no
guild_alliance_onlygm: no
