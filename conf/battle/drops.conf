//--------------------------------------------------------------
// rAthena 전투 설정 파일
// 원래 번역: Peter Kieser <pfak@telus.net>
// 간단한 영어로 변경: Ancyker
//--------------------------------------------------------------
// 주의 1: 값은 설정 스위치 (on/off, yes/no 또는 1/0)
// 주의 2: 값은 백분율 (100은 100%를 의미합니다)
//--------------------------------------------------------------

// 아이템이 드랍될 때, 바로 사용자의 인벤토리로 들어갑니까? (참고 1)
item_auto_get: no

// 아이템이 드랍된 후 바닥에서 사라지기까지 걸리는 시간은 얼마나 됩니까? (밀리초 단위)
flooritem_lifetime: 60000

// 몬스터에게 가장 많은 피해를 준 사람이 아이템을 획득할 수 있는 유예 시간은 얼마입니까? (밀리초 단위)
item_first_get_time: 3000

// 몬스터에게 가장 많은 피해를 준 첫 번째와 두 번째 사람이 아이템을 획득할 수 있는 유예 시간은 얼마입니까? (밀리초 단위)
// (item_first_get_time 경과 후 적용됩니다)
item_second_get_time: 1000

// 몬스터에게 가장 많은 피해를 준 첫 번째, 두 번째, 세 번째 사람이 아이템을 획득할 수 있는 유예 시간은 얼마입니까? (밀리초 단위)
// (item_second_get_time 경과 후 적용됩니다)
item_third_get_time: 1000

// 가장 가치 있는 플레이어가 보상 아이템을 받을 수 없고 아이템이 바닥에 떨어졌을 때, MvP 보상 아이템에 적용되는 유예 시간은 얼마입니까? (밀리초 단위)
mvp_item_first_get_time: 10000

// 첫 번째와 두 번째 MvP가 아이템을 획득할 수 있는 유예 시간은 얼마입니까? (밀리초 단위)
// (mvp_item_first_get_time 경과 후 적용됩니다)
mvp_item_second_get_time: 10000

// 첫 번째, 두 번째, 세 번째 MvP가 아이템을 획득할 수 있는 유예 시간은 얼마입니까? (밀리초 단위)
// (mvp_item_second_get_time 경과 후 적용됩니다)
mvp_item_third_get_time: 2000

// 아이템 드랍율 (참고 2)

// 일반 아이템의 드랍율 (ETC 탭의 아이템, 카드 제외)
item_rate_common: 100
item_rate_common_boss: 100
item_rate_common_mvp: 100
item_drop_common_min: 1
item_drop_common_max: 10000

// 치유 아이템의 드랍율 (HP 또는 SP를 회복하는 아이템)
item_rate_heal: 100
item_rate_heal_boss: 100
item_rate_heal_mvp: 100
item_drop_heal_min: 1
item_drop_heal_max: 10000

// 치유 아이템을 제외한 사용 가능한 아이템의 드랍율 (아이템 탭에 있는 아이템)
item_rate_use: 100
item_rate_use_boss: 100
item_rate_use_mvp: 100
item_drop_use_min: 1
item_drop_use_max: 10000

// 장비의 드랍율
item_rate_equip: 100
item_rate_equip_boss: 100
item_rate_equip_mvp: 100
item_drop_equip_min: 1
item_drop_equip_max: 10000

// 카드의 드랍율
item_rate_card: 100
item_rate_card_boss: 100
item_rate_card_mvp: 100
item_drop_card_min: 1
item_drop_card_max: 10000

// MVP가 직접 인벤토리에 얻는 MVP 아이템의 드랍율 조정
// 모드: 0 - 공식 순서, 1 - 무작위 순서, 2 - 모든 아이템
item_rate_mvp: 100
item_drop_mvp_min: 1
item_drop_mvp_max: 10000
item_drop_mvp_mode: 0

// 카드 부여 아이템 드랍율 조정
item_rate_adddrop: 100
item_drop_add_min: 1
item_drop_add_max: 10000

// 보물 상자 드랍율 조정 (다른 모든 수정자를 무시함)
item_rate_treasure: 100
item_drop_treasure_min: 1
item_drop_treasure_max: 10000

// 로그 스케일 드랍율을 사용할까요? (참고 1)
// 로그 스케일 드랍율은 Droprate(x,y) = x * (5 - log(x)) ^ (ln(y) / ln(5)) 공식을 사용하여 드랍율을 비선형적으로 조정합니다.
// 여기서 x는 원래 드랍율이고 y는 드랍율 수정자입니다 (이전에 언급한 item_rate* 변수)
// 로그 스케일 드랍율을 사용할 때 드랍율이 어떻게 영향을 받는지 이해하기 위해 다음 표를 참조하십시오:
// Y: 원래 드랍율
// X: 드랍율 수정자 (예: item_rate_equip)
//  X\Y | 0.01 0.02  0.05  0.10  0.20  0.50  1.00  2.00  5.00 10.00 20.00
// -----+---------------------------------------------------------------
//   50 | 0.01 0.01  0.03  0.06  0.11  0.30  0.62  1.30  3.49  7.42 15.92
//  100 | 0.01 0.02  0.05  0.10  0.20  0.50  1.00  2.00  5.00 10.00 20.00
//  200 | 0.02 0.04  0.09  0.18  0.35  0.84  1.61  3.07  7.16 13.48 25.13
//  500 | 0.05 0.09  0.22  0.40  0.74  1.65  3.00  5.40 11.51 20.00 33.98
// 1000 | 0.10 0.18  0.40  0.73  1.30  2.76  4.82  8.28 16.47 26.96 42.69
// 2000 | 0.20 0.36  0.76  1.32  2.28  4.62  7.73 12.70 23.58 36.33 53.64
// 5000 | 0.50 0.86  1.73  2.91  4.81  9.11 14.45 22.34 37.90 53.91 72.53
//10000 | 1.00 1.67  3.25  5.28  8.44 15.24 23.19 34.26 54.57 72.67 91.13
//20000 | 2.00 3.26  6.09  9.59 14.83 25.49 37.21 52.55 77.70 97.95  100%
//50000 | 5.00 7.87 13.98 21.12 31.23 50.31 69.56 92.48  100%  100%  100%
item_logarithmic_drops: no

// 몬스터의 드랍율이 0이 될 수 있습니까? (참고 1)
// 기본값: 아니오 (공식 서버와 동일).
drop_rate0item: no

// 아이템 드랍율을 0.01% 증가시킵니까? (참고 1)
// 공식 서버에서는 0.00% 드랍 확률이 가능하여 모든 아이템이 0.01% 증가합니다.
// 참고: 이것은 rAthena에서는 버그로 간주됩니다.
// 기본값: 아니오
drop_rateincrease: no

// LUK 값이 절대적으로 드랍율에 영향을 미치게 합니까?
// 100으로 설정하면 LUK마다 0.01%의 아이템 발견 확률이 증가합니다
// (아이템의 기본 드랍율과 관계없이).
drops_by_luk: 0

// LUK 값이 상대적으로 드랍율에 영향을 미치게 합니까?
// 100으로 설정하면 LUK마다 아이템 발견 확률이 1% 증가합니다
// (따라서 LUK 100일 때 모든 아이템의 드랍 확률이 두 배가 됩니다).
drops_by_luk2: 0

// Ore Discovery 스킬로 몬스터가 광석을 드랍하는 비율 (기본값은 100)
finding_ore_rate: 100

// 연금술사가 소환한 마린 스피어와 플로라가 아이템을 드랍합니까?
// 이 설정에는 세 가지 값이 있습니다:
// 0: 아무것도 드랍하지 않음.
// 1: 마린 스피어만 아이템을 드랍합니다.
// 2: 모든 연금술사 소환물이 아이템을 드랍합니다.
alchemist_summon_reward: 1

// ** Player1이 Pupa의 Pupa 카드를 획득했습니다 (확률 0.01%) ** 방송을 합니까?
// 이 값은 0~10000 사이의 값으로 설정할 수 있습니다.
// 참고: 희귀 아이템을 훔치는 경우에도 방송됩니다.
// 0 = 방송을 전혀 표시하지 않음
// 1 = 0.01% 드랍 확률 아이템에 대해 방송을 표시
// 333 = 3.33% 이하의 드랍 확률 아이템에 대해 방송을 표시
// 10000 = 모든 아이템에 대해 방송을 표시
rare_drop_announce: 0

// 자동 습득이 플레이어 보너스 및 페널티를 고려합니까? (참고 1)
// RENEWAL_DROP, Bubble Gum 또는 기타 수정자가 활성화된 경우 자동 습득이 이를 고려합니다.
autoloot_adjust: 0

// 용병이 몬스터를 죽였을 때 자동 습득이 작동합니까?
mercenary_autoloot: no

// 주인이 유휴 상태일 때 용병이 아이템을 얻는 것이 비활성화됩니까?
// 아니오로 설정하거나 유휴 상태로 간주되기 전까지 필요한 시간 (밀리초가 아닌 초)을 설정하십시오.
// 채팅/벤딩 중인 캐릭터는 항상 유휴 상태로 간주됩니다.
// 캐릭터의 유휴 상태는 아이템 사용/스킬 사용/공격 (자동 공격도 포함)/이동 시 재설정됩니다.
// 'mercenary_autoloot'이 활성화된 경우에만 주인이 아이템을 받으며,
// 그렇지 않으면 일반적으로 아이템이 바닥에 떨어집니다.
// 참고: 이 옵션은 정상적인 유휴 타이머와 분리된 특수 타이머를 사용하여 유휴 시간을 추적합니다.
mer_idle_no_share: no

// 서버가 용병 주인의 유휴 시간을 어떻게 측정해야 합니까? (참고 3)
// ('mer_idle_no_share'가 활성화된 경우에만 작동합니다).
// 0x001 - 걷기 요청
// 0x002 - ID로 스킬 사용 요청 (대상 지정 스킬 사용 시도)
// 0x004 - 위치로 스킬 사용 요청 (AoE 스킬 사용 시도)
// 0x008 - 아이템 사용 요청 (장비 착용/해제 포함)
// 0x010 - 공격 요청
// 0x020 - 채팅 요청 (귓속말, 파티, 길드, 전장 등)
// 0x040 - 앉기/일어서기 요청
// 0x080 - 감정 표현 요청
// 0x100 - 아이템 드랍 요청
// 0x200 - @/#명령어 요청
// 최소한 하나의 옵션이 활성화되어야 합니다.
// 옵션이 많을수록 이 기능을 속이기 쉬워집니다.
// 기본값: 걷기 (0x1) + ID로 스킬 사용 (0x2) + 위치로 스킬 사용 (0x4) + 아이템 사용 (0x8) + 공격 (0x10) = 0x1F
// 참고: 이는 용병에 대해 정상적인 유휴 타이머 및 'idletime_option'과 분리된 설정을 구성할 수 있게 합니다.
// 용병만 죽이는 경우에만 적용되며, 일반 자동 습득 및 파티 공유 옵션에는 영향을 미치지 않습니다.
idletime_mer_option: 0x1F

// 드랍율이 이 값보다 낮고 보너스가 적용된 경우, 보너스는 이 값을 초과할 수 없습니다.
drop_rate_cap: 9000
drop_rate_cap_vip: 9000

// 랜덤 옵션이 포함된 몬스터가 드랍한 아이템에 대해 색상 기둥 효과를 표시합니까?
rndopt_drop_pillar: on
