//--------------------------------------------------------------
// rAthena 기능 설정 파일
//--------------------------------------------------------------
// 주의 1: 값은 설정 스위치 (on/off, yes/no 또는 1/0)
// 주의 2: 값은 백분율 (100은 100%를 의미합니다)
// 주의 3: 값은 비트 필드입니다. 설명이 없는 경우,
//         단위 유형을 가정합니다 (1: Pc, 2: Mob, 4: Pet, 8: Homun, 16: Mercenary, 128: NPC, 512: Elemental)
//--------------------------------------------------------------

// 구매 상점 (참고 1)
// 요구 사항: 2010-04-27aRagexeRE 이상
feature.buying_store: on

// 상점 검색 (참고 1)
// 요구 사항: 2010-08-03aRagexeRE 이상
feature.search_stores: on

// Atcommand 제안 (참고 1)
// 불완전한 atcommand를 입력하면, 완전한 것을 제안합니다.
feature.atcommand_suggestions: off

// 경매 (참고 1)
// 2012년 이후 클라이언트에서 불안정해졌으나 (정확한 날짜는 알 수 없음),
// 2013-05-15 이후 클라이언트에서 수정되었습니다.
// 그러나 2014-11-12 이후 클라이언트에서 다시 제거되었습니다.
feature.auction: off

// 워프 제안 (참고 1)
// 존재하지 않는 맵으로 @warp를 시도할 때 제안을 표시합니까?
feature.warp_suggestions: off

// 은행 (참고 1)
// 요구 사항: 2013-07-24aRagexe 이상
feature.banking: on

// 은행이 제니 입금 및 인출 시 UI 상태를 엄격히 확인해야 합니까? (참고 1)
// 참고: 기본적으로 비활성화되어 있습니다. 공식 클라이언트가 서버에 은행 UI 상태를 보고하지 않기 때문입니다.
// 그러나 실제로 UI 상태를 보고하는 클라이언트나 커스텀 클라이언트의 경우 이 설정이 유용할 수 있습니다.
feature.banking_state_enforce: no

// 자동 거래 지속성 (참고 1)
// @autotrade를 사용한 상인이 재시작 후 복원되어야 합니까?
feature.autotrade: on

// 재스폰된 자동 거래자가 바라볼 방향은?
// 가능한 값은 0-7입니다.
// 기본값: 4(남쪽)
// -1 = 마지막 플레이어의 방향
feature.autotrade_direction: 4

// 플레이어의 머리 방향을 변경합니까?
// -1 = 마지막 조건
//  0 = 앞으로
//  1 = 오른쪽
//  2 = 왼쪽
feature.autotrade_head_direction: 0

// 자동 거래자가 앉을까요?
// -1 = 마지막 플레이어의 상태, 앉기 또는 서기
//  0 = 서기
//  1 = 앉기
feature.autotrade_sit: 1

// 플레이어가 로그인한 후 상점/구매 상점을 여는 지연 시간 (밀리초 단위).
feature.autotrade_open_delay: 5000

// 전장에서 어디서나 전투 메뉴를 사용하여 전장 대기열 인터페이스.
// 요구 사항: 2012-04-10aRagexe 이상
feature.bgqueue: on

// 룰렛 (참고 1)
// 요구 사항: 2014-10-22bRagexe 이상
feature.roulette: on

// 룰렛 보너스 보상
// 보상 아이템 ID가 보너스 아이템 ID와 같으면 금액을 2배로 증가
feature.roulette_bonus_reward: on

// 업적 (참고 1)
// 요구 사항: 2015-05-13aRagexe 이상
feature.achievement: on

// 정제 UI (참고 1)
// 요구 사항: 2016-10-12aRagexeRE 이상
feature.refineui: on

// 장비 전환 (참고 1)
// 요구 사항: 2017-02-08bRagexeRE 이상
feature.equipswitch: on

// 애완동물 진화 (참고 1)
// 요구 사항: 2014-10-08aRagexe 이상
feature.petevolution: on

// 자동 애완동물 먹이주기 (참고 1)
// 요구 사항: 2014-10-08aRagexe 이상
feature.petautofeed: on

// 애완동물 자동 먹이주기가 발동할 배고픔 비율은? (참고 2)
// 기본값: 89
feature.pet_autofeed_rate: 89

// 자동 호문쿨러스 먹이주기 (참고 1)
// 요구 사항: 2017-09-20bRagexeRE 이상
feature.homunculus_autofeed: on

// 호문쿨러스 자동 먹이주기가 발동할 비율은? (참고 2)
// 기본값: 30
//
// 참고:
// 이 설정은 클라이언트 측 LUA가 버그가 있는 경우에만 적용됩니다.
// 기본적으로 클라이언트는 하드코딩된 제한에 도달하면 자체적으로 먹이주기 패킷을 전송합니다.
feature.homunculus_autofeed_rate: 30

// 출석 시스템 (참고 1)
// 요구 사항: 2018-03-07bRagexeRE 이상
feature.attendance: on

// 개인 비행선 시스템 (참고 1)
// 요구 사항: 2018-03-21aRagexeRE 이상
feature.privateairship: on

// 물물교환 상점 시스템 (참고 1)
// 요구 사항: 2019-01-16RagexeRE 이상
feature.barter: on

// 확장 물물교환 상점 시스템 (참고 1)
// 요구 사항: 2019-11-06RagexeRE 이상
feature.barter_extended: on

// 동적 NPC가 사용되지 않을 경우 삭제되는 시간 (밀리초 단위).
// 기본값: 60000 (60초)
feature.dynamicnpc_timeout: 60000

// 동적 NPC가 플레이어를 기준으로 스폰되는 x 범위.
// 기본값: 2
feature.dynamicnpc_rangex: 2

// 동적 NPC가 플레이어를 기준으로 스폰되는 y 범위.
// 기본값: 2
feature.dynamicnpc_rangey: 2

// 동적 NPC가 플레이어를 향해 바라보도록 설정할까요? (참고 1)
// 기본값: 아니오
feature.dynamicnpc_direction: no

// 정보 관련 명령어에서 아이템 링크 시스템 (참고 1)
// 아이템에 대한 아이템 링크 문자열을 생성하여 npctalk, 메시지, dispbottom 및 방송 명령어에 사용할 수 있습니다.
// 결과는 플레이어의 인벤토리/카트/장비 창에서 SHIFT+Click과 동일한 클릭 가능한 아이템 이름입니다.
// 요구 사항: 2015-11-04Ragexe 이상
feature.itemlink: on

// NPC 메시지에서 아이템 링크 시스템 (참고 1)
// 아이템에 대한 아이템 링크 문자열을 생성하여 NPC의 mes 명령어에 사용할 수 있습니다.
// 요구 사항: 2010-01-01 이상
feature.mesitemlink: on

// 모든 mesitemlinks를 괄호로 감쌀까요? (참고 1)
// 기본값: 아니오
feature.mesitemlink_brackets: no

// 모든 mesitemlinks가 데이터베이스 이름을 사용하도록 강제할까요? (참고 1)
// 기본값: 아니오
feature.mesitemlink_dbname: no

// 스타일리스트 UI (참고 1)
// 요구 사항: 2015-11-04 이상
feature.stylist: on

// 플레이어가 인스턴스에 다시 연결할 수 있도록 허용할까요? (참고 1)
// 이는 리뉴얼 모드에서 기본적으로 활성화되고,
// 프리 리뉴얼 모드에서 기본적으로 비활성화됩니다.
// 이 옵션이 허용되면 "nosave" 맵 플래그는 여전히 적용되며,
// 플레이어가 인스턴스로 다시 이동하는 것을 방지할 수 있습니다.
//feature.instance_allow_reconnect: yes

// Gold PC 타이머를 활성화하시겠습니까? (참고 1)골드 PC 타이머?(참고 1)
// 기본값: yes
//feature.goldpc_active: yes

// 플레이어는 점수를 받으려면 몇 초 동안 온라인 상태를 유지해야 합니까?플레이어가 점수를 받으려면 몇 초 동안 온라인 상태를 유지해야 합니까?포인트를 받으려면 온라인 상태에 있어야 합니까 ?
// 기본값: 3600(1시간)
