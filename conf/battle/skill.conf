//--------------------------------------------------------------
// rAthena 전투 설정 파일
// 원래 번역: Peter Kieser <pfak@telus.net>
// 간단한 영어로 변경: Ancyker
//--------------------------------------------------------------
// 주의 1: 값은 설정 스위치 (on/off, yes/no 또는 1/0)
// 주의 2: 값은 백분율 (100은 100%를 의미합니다)
// 주의 3: 값은 비트 필드입니다. 설명이 없으면 기본적으로 단위 유형을 가정합니다 (1: Pc, 2: Mob, 4: Pet, 8: Homun, 16: Mercenary)
//--------------------------------------------------------------

// 주문 시전 시간이 걸리는 비율 (참고 2, 0 = 시전 시간 없음)
casting_rate: 100

// 시전 후 딜레이 시간 (참고 2)
delay_rate: 100

// 딜레이 시간이 시전자의 DEX 및/또는 AGI에 따라 달라집니까? (참고 1)
// 참고: 공식 서버에서는 DEX나 AGI가 딜레이 시간에 영향을 주지 않습니다.
delay_dependon_dex: no
delay_dependon_agi: no

// 시전 시작 후 모든 스킬에 허용되는 최소 딜레이 (밀리초 단위) (참고 1)
// 참고: 이 값을 0 이상으로 설정하면 스피드핵을 방지할 수 있습니다.
min_skill_delay_limit: 100

// 이 딜레이는 모든 스킬의 최소 '이동 불가 딜레이'입니다.
// 참고: 이 값을 너무 낮게 설정하면 스킬 사용 후 캐릭터가 너무 빨리 움직이게 되어 클라이언트가 이를 업데이트하지 않으며, 플레이어가 나중에 "텔레포트"하는 것처럼 보일 수 있습니다. 몬스터는 AttackMotion을 사용합니다.
default_walk_delay: 300

// 다음 유형의 스킬 딜레이를 완전히 비활성화합니까? (참고 3)
// 참고: 기본적으로 몹은 스킬 데이터베이스에 지정된 스킬 딜레이를 따르지 않지만, mob skill db에 지정된 자체 '재사용' 스킬 딜레이를 따릅니다. 설정되면 모든 스킬의 딜레이는 min_skill_delay_limit이 됩니다.
no_skill_delay: 2

// 어떤 DEX에서 시전 시간이 0이 됩니까 (즉시 시전)?
castrate_dex_scale: 150

// 얼마나 많은 (dex*2+int)로 가변 시전 시간이 0이 됩니까?
vcast_stat_scale: 530

// 공식 서버에서는 amotion 딜레이가 시전 시작 시 적용됩니다. 시전 종료 시에는 amotion 딜레이가 적용되지 않습니다. (참고 2)
// 참고: 이 설정을 하면 시전 시간이 있지만 시전 후 딜레이가 없는 스킬의 체인을 끊을 수 있습니다. 클라이언트 측 딜레이는 스킬마다 다르며 일반적으로 140에서 180 사이입니다. 보안을 원한다면 90에서 140 사이의 값이 권장됩니다.
skill_amotion_leniency: 0

// 일반 공격이 스킬 후 딜레이를 무시할 수 있습니까? (참고 1)
skill_delay_attack_enable: yes

// 스킬 시전이 끝난 후 스킬에 추가되는 범위.
// 스킬 시전이 시작된 후 대상이 범위를 벗어나면 스킬이 실패하는지 여부를 결정합니다.
// 0은 범위 확인을 비활성화합니다 (기본값)
skill_add_range: 0

// 시전 중에 대상이 범위를 벗어나면 스킬 아이템과 SP를 소비합니까? (참고 1)
skill_out_range_consume: no

// 시전자와 대상 사이의 거리가 스킬이 원거리 스킬인지 여부를 정의합니까? (참고 3)
// 설정되면 시전자와 대상 사이의 거리가 3보다 클 때 스킬이 원거리 스킬로 간주되며, 그렇지 않으면 근거리 스킬로 간주됩니다. 설정되지 않으면 스킬의 범위로 결정됩니다 (5 이상이면 스킬이 원거리 스킬로 간주됩니다).
// 기본값 14 (몹 + 펫 + 호문쿨루스)
skillrange_by_distance: 14

// 대부분의 무기 기반 스킬에 대해 장착된 무기의 범위가 skill_db에 정의된 스킬 범위를 대체합니까? (참고 3)
// 참고: 이 옵션에 영향을 받는 스킬은 skill_db에 범위가 음수로 표시된 스킬입니다. 기본적으로 항상 스킬 범위가 사용됩니다. 모든 몬스터 스킬의 범위를 9로 설정하려면 monster_ai&0x400을 설정해야 합니다.
skillrange_from_weapon: 0

// 모든 스킬 공격에서 시전자의 상태를 확인해야 합니까?
// 예로 설정하면, 메테오, 스톰 거스트 및 기타 모든 지상 스킬은 시전자가 싸울 수 없는 상태일 때 아무런 영향을 미치지 않습니다 (예: 기절).
skill_caster_check: yes

// 시전자가 죽을 때 지상에 배치된 스킬이 제거됩니까? (참고 3)
clear_skills_on_death: 0

// 시전자가 맵을 변경할 때 지상에 배치된 스킬이 제거됩니까? (참고 3)
clear_skills_on_warp: 15

// 이것을 예로 설정하면 0x01 플래그가 있는 지상 기반 스킬의 대상 모드를 "적 없음"으로 대체합니다.
// 기본적으로 영향을 받는 두 스킬은 Pneuma와 Safety Wall입니다 (예로 설정하면 이 두 스킬은 모든 사람을 보호하지 않고 동료만 보호합니다).
// 자세한 내용은 db/(pre-)re/skill_db.yml을 참조하십시오.
defunit_not_enemy: no

// 스킬이 빗나가지 않거나 차단되지 않을 때 최소한의 '히트' 피해를 항상 입어야 합니까?
// 많은 스킬이 히트 수에 따라 피해가 곱해지며 (skill_db 참조), 이들은 식물에 대해 1 HP 피해를 항상 입힙니다. 하지만 일부 스킬은 단일 히트로 표시되며 히트 수에 따라 피해가 나누어지고 내림됩니다. 즉, 식물은 이러한 스킬로 인해 아무런 피해도 입지 않습니다. 예: 소닉 블로우, 로드 오브 버밀리온
// 이 설정을 통해 공식 동작을 변경하여 이러한 스킬이 히트마다 최소 1 HP 피해를 입도록 할 수 있습니다.
// 값: 1은 무기 기반 공격, 2는 마법 공격, 4는 기타 공격에 해당합니다.
skill_min_damage: 0

// 몽크의 콤보 딜레이 비율 (참고 2)
combo_delay_rate: 100

// 대체 자동 반격 공격 유형을 사용합니까? (참고 3)
// 캐릭터에 대해 설정된 경우, 100% 크리티컬,
// 그렇지 않으면 DEF를 무시하고 HIT+20, CRI*2
auto_counter_type: 15

// 지상 스킬이 서로 위에 배치될 수 있습니까? (참고 3)
// 기본적으로 UF_NOREITERATION 설정된 스킬은 다른 스킬 위에 겹쳐 놓을 수 없지만, 이 설정은 이를 무시합니다.
skill_reiteration: 0

// 지상 스킬이 플레이어/몬스터 아래에 배치될 수 없습니까? (참고 3)
// 설정되면 UF_NOFOOTSET 설정된 스킬에만 영향을 미칩니다.
skill_nofootset: 1

// 함정 (헌터 함정 + 퀘그마이어)이 GVG/PVP 지역 내에서 모든 대상을 대상으로 변경됩니까? (참고 3)
// 공식 서버의 기본값: 1 (플레이어에게만 해당)
gvg_traps_target_all: 1

// 함정 가시성 설정 (UF_HIDDEN_TRAP 플래그가 있는 함정):
// 0 = 항상 가시성
// 1 = 대항 맵에서 가시성 활성화 (GVG/PVP/BG)
// 2 = 모든 맵에서 가시성 활성화
// 공식 서버의 기본값: 프리 리뉴얼은 0, 리뉴얼은 2
//traps_setting: 0

// 연금술사의 소환 플로라 스킬에 적용되는 제한 사항 (필요에 따라 추가)
// 1: 대항 맵 외부에서 플로라를 공격할 수 있습니다.
// 2: 다른 유형을 동시에 소환할 수 없음
// (예: 이미 하이드라가 하나 있는 경우 다른 것을 소환하는 것을 금지)
summon_flora_setting: 3

// 설치된 스킬이 벽을 확인합니까? (참고 1)
// (예: 스톰 거스트가 벽을 맞추면 다른 쪽을 맞추지 않습니다.)
skill_wall_check: yes

// 은신 시 벽을 확인합니까? (참고 1)
// 참고: 스킬이 벽을 확인하지 않으면 항상 벽 옆에 있는 것으로 간주됩니다 (벽 기반 속도를 항상 얻음). 
// 맞았을 때 항상 은신이 해제됩니다.
// 
// 0 = 벽을 확인하지 않음
// 1 = 벽을 확인함
// 2 = 공격 시 은신이 해제되지 않음.
// 4 = 스킬 사용 시 은신이 해제되지 않음
player_cloak_check_type: 1
monster_cloak_check_type: 4

// 무제한 지상 스킬을 동시에 배치할 수 없음 (참고 3)
land_skill_limit: 9

// 어떤 종류의 스킬 실패 메시지를 전송해야 합니까:
// 1 - 모든 스킬 실패 메시지를 비활성화.
// 2 - 행동 지연으로 인한 스킬 실패 메시지를 비활성화.
// 4 - Snatcher로 인한 실패 메시지 비활성화
// 8 - Envenom으로 인한 실패 메시지 비활성화
display_skill_fail: 2

// 게임 내 채팅방에 있는 플레이어가 워프 포털로 워프될 수 있습니까? (참고 1)
chat_warpportal: no

// 마법사의 "Sense" 스킬이 방어 필드를 표시하는 방법은 무엇입니까?
// 0: 방어 표시 안 함
// 1: 기본 방어 [RE 기본값]
// 2: Vit/Int 방어
// 3: 둘 다 (두 방어의 합산)
sense_type: 1

// 어떤 피어싱 공격 스타일이 사용됩니까?
// 0 = Aegis 스타일 (단일 다중 히트 공격)
// 1 = Athena 스타일 (연속적인 여러 공격)
finger_offensive_type: 0

// 그랜드 크로스 설정 (이 설정을 변경하지 마십시오)
// 공식적으로 그랜드 크로스에는 네 개의 피해 파도가 있지만, 각 셀은 최소 3번 히트한 후 다음 파도에서 더 이상 피해를 입지 않습니다. 이동하는 몬스터는 최대 4번 히트를 입을 수 있으며, 몬스터의 무리는 1-3번 히트를 입을 수 있습니다.
// 예로 설정하면 모든 파도가 모든 대상에게 피해를 입힙니다.
// 힌트: 파도의 수를 줄이려면 스킬의 지속 시간을 줄여야 합니다 (예: 세 개의 피해 파도에 대해 800ms로 설정).
gx_allhit: no

// 그랜드 크로스 표시 유형 (기본값 1)
// 0: 노란색 캐릭터
// 1: 흰색 캐릭터
gx_disptype: 1

// 데보션의 최대 레벨 차이
devotion_level_difference: 10

// 데보션 대 반사 피해에 대해 '이전' 동작을 사용합니까? (참고 2)
// 기본값은 0 (공식)입니다. 'devotion_rdamage'가 > 0 (반사 피해를 데보션할 확률)이면, 데보션을 제공하는 사람이 대신 피해를 입습니다.
devotion_rdamage: 0

// 공식적으로 반사 방패 (SC_REFLECTDAMAGE)는 스킬이나 일반 공격으로 인한 물리 피해를 반사합니다. 하지만 대상이 데보션을 받고 있는 경우, 반사 피해는 근접 스킬에 대해서만 반사됩니다. (참고 1)
devotion_rdamage_skill_only: yes

// AEGIS에는 데보션을 받고 있는 플레이어가 앉아 있을 때 공격을 받을 때 버그가 있습니다. 클라이언트 측에서 플레이어는 일어서지만 서버 측에서는 계속 앉아 있습니다. 이로 인해 플레이어는 다시 앉았다가 일어서거나 @refresh 명령어를 사용하기 전까지는 더 이상 걷지 못합니다. 자세한 내용은 https://github.com/rathena/rathena/issues/1927에서 확인할 수 있습니다.
// 기본값: 예 (권장되는 버그 수정 사항이기 때문에)
// 공식: 아니요
devotion_standup_fix: yes

// 파트너 없이 앙상블 스킬을 사용할 수 있습니까? (참고 1)
player_skill_partner_check: yes

// 함정 제거 유형
// 0 = Aegis 시스템: 1개의 '함정' 아이템 반환
// 1 = Athena 시스템: 함정을 설치하는 데 사용된 모든 아이템 반환
skill_removetrap_type: 0

// 활을 사용하여 백스탭을 하면 50% 피해 페널티가 부여됩니까? (참고 1)
backstab_bow_penalty: yes

// 몹에서 몇 번이나 훔치기를 시도할 수 있습니까?
// 참고: 희귀 아이템 몇 개만 있는 몬스터에 대한 훔치기 악용 방지에 도움이 됩니다.
// 사용하려면 0을 설정하십시오 (허용되는 최대 값은 255입니다).
skill_steal_max_tries: 0

// 훔친 아이템에 랜덤 옵션이 적용됩니까? (참고 1)
// 공식: 아니요
skill_steal_random_options: no

// "MVP 힐"의 레벨과 강도. 누군가가 이 레벨 이상의 힐을 시전하면 힐 공식이 무시되고 이 값이 대신 사용됩니다.
max_heal: 9999
max_heal_lv: 11

// 응급 소집 길드 스킬 설정 (적절히 추가).
// 스킬을 사용 가능하게 하려면 최소 1/2 및 4/8이 필요합니다.
// 1: WoE 외부에서 스킬 사용 가능.
// 2: WoE 중 스킬 사용 가능.
// 4: GvG 지역 외부에서 스킬 사용 가능
// 8: GvG 지역에서 스킬 사용 가능
//16: "nowarpto" 맵에서 스킬 사용 금지
//    (GVG 성에서는 nowarpto로 설정된 경우에도 작동합니다)
emergency_call: 11

// 길드 오라 스킬 설정 (적절히 추가).
// (이 설정은 GD_LEADERSHIP, GD_GLORYWOUNDS, GD_SOULCOLD 및 GD_HAWKEYES에 영향을 미침)
// 스킬을 사용 가능하게 하려면 최소 1/2 및 4/8이 필요합니다.
// 1: WoE 외부에서 스킬 사용 가능.
// 2: WoE 중 스킬 사용 가능.
// 4: GvG 지역 외부에서 스킬 사용 가능
// 8: GvG 지역에서 스킬 사용 가능
//16: 길드 마스터에게 영향을 미치지 않도록 스킬 사용 금지
guild_aura: 31

// 몬스터 스킬의 최대 레벨
// 참고: MVP가 너무 강력하면 10으로 줄이십시오.
mob_max_skilllvl: 100

// 텔레포트 레벨 1을 시전할 때 메뉴를 건너뛰도록 허용합니까?
// 메뉴에는 두 가지 옵션이 있습니다. "무작위"와 "취소"
skip_teleport_lv1_menu: no

// SG 스킬을 적절한 날 (태양/달/별) 없이 사용할 수 있습니까?
allow_skill_without_day: no

// ES 유형 마법을 플레이어에게 사용할 수 있습니까?
allow_es_magic_player: no

// 태양, 달, 별의 기적 스킬 비율
// 유효 값 범위는 1 (0.005% 히트당)에서 20000 (100% 히트당)입니다.
// 이 확률은 AGI가 46 이상일 경우 더 줄어듭니다 (92 = 절반 확률).
sg_miracle_skill_ratio: 1

// 태양, 달, 별의 기적 스킬 지속 시간 (밀리초 단위)
sg_miracle_skill_duration: 3600000

// 태양, 달, 별의 천사 스킬 비율 (100% = 10000)
sg_angel_skill_ratio: 10

// bHealPower가 영향을 미치는 스킬
// 1: Heal, 2: Sanctuary, 4: Potion Pitcher, 8: Slim Pitcher, 16: Apple of Idun,
// 32: Coluceo Heal, 64: Highness Heal, 128: Mediale Votum, 256: Dilectio Heal
skill_add_heal_rate: 487

// 화면에 단일 대상이 있는 경우 지진(EarthQuake) 피해가 반사될 수 있습니까?
// 참고: 공식 서버에서는 화면에 단일 대상이 있을 때 EQ가 반사 가능하며, 이는 MVP 사냥에 대한 악용일 수 있습니다.
eq_single_target_reflectable: yes

// 공식 서버에서는 반사 및 일부 타로 카드에서 피해를 받을 때 무적 상태에서도 피해를 입습니다.
// 이 설정을 활성화하면 모든 종류의 피해에 면역이 됩니다 (이전 값은 표시되지만 실제 피해는 입지 않습니다).
invincible.nodamage: no

// 무기 스위치 무도회
// 공식 서버에서는 노래를 취소하기 위해 무기 스위치를 방지하는 수정이 있습니다.
// 기본값: 예
dancing_weaponswitch_fix: yes

// 스킬 함정 유형
// 공식 서버에서는 유닛이 노크백에 완전히 면역이면 정지 상태 효과 (함정 포함)로 인해 목표 타일에 도달하기 전에 멈춥니다. 이 경우 몬스터는 이동 중에도 함정을 활성화합니다.
// 이 옵션은 노크백 면역 보너스가 없는 경우에만 적용됩니다. 이 보너스는 노크백 스킬에만 해당됩니다.
// 0: (공식)
// 1: GvG/WoE에서 정지 효과는 유닛을 즉시 멈춥니다.
// 2: 정지 효과는 몬스터를 노크백 면역으로 만듭니다 / 보스는 즉시 멈춥니다.
// 3: 1+2
skill_trap_type: 0

// 볼링 배시 연쇄 반응의 영역 (프리 리뉴얼 전용)
// 0: 공식 그터 라인 시스템 사용
// 1: 그터 라인 시스템에서 데미 그터 버그 제거
// 2-20: 시전자 주위의 영역 (2 = 5x5, 3 = 7x7, 4 = 9x9, ..., 20 = 41x41)
// 참고: 영역 밖으로 대상을 노크백하면 한 번만 히트를 입으며 스플래시 피해를 입지 않습니다.
bowling_bash_area: 0

// 노크백 방향 (참고 1)
// 공식 서버에서는 벽에 부딪히면 유닛이 항상 멈춥니다.
// "아니요"로 설정하면 유닛은 대각선으로 벽에 접근할 때 계속 이동합니다 (이전 Athena 동작).
path_blown_halt: yes

// 태권 미션 몹 이름 확인
// iRO 위키에서는: 목표가 고블린인 경우 "고블린"이라는 이름을 가진 모든 몬스터가 미션에 포함됩니다.
// 0: 비활성화 (기본값)
// 1: Mob ID와 관계없이 모든 5개의 고블린 몬스터가 포함됩니다 (Mob ID: 1122-1126) - iRO 기본값
// 2: Mob ID와 관계없이 같은 이름을 가진 모든 몬스터가 포함됩니다 - jName 기반 비교
taekwon_mission_mobname: 0

// 플레이어가 맵 워프 포털 위로 텔레포트할 수 있습니까? (참고 1)
// 공식 서버에서는 플레이어가 이를 수행할 수 없습니다.
teleport_on_portal: no

// 카트 레볼루션의 노크백 방향이 항상 서쪽입니까? (참고 1)
// 공식 서버에서는 대상이 항상 서쪽으로 노크백됩니다. 비활성화하면 대상이 뒤로 노크백됩니다.
cart_revo_knockback: yes

// 공식 서버에서는 화살 샤워의 노크백 방향이 스킬 배치 위치에서 대상 대신 시전자에서 대상까지를 기반으로 합니다.
arrow_shower_knockback: yes

// 공식 서버에서는 스톰 거스트는 81개의 유닛으로 구성되어 있으며, 모든 유닛은 "중앙에서 멀리" 3x3 스플래시 피해를 입습니다. 남서쪽 셀이 먼저 처리되므로 보통 북동쪽으로 노크백됩니다. 가장자리에서는 SG로부터 멀리 노크백됩니다. 노크백 방향은 간반테인 및 랜드 프로텍터에 의해 영향을 받을 수 있습니다. 예를 들어 SG에 구멍을 뚫으면 "빨아들이는" 효과가 생깁니다.
// 이 설정을 비활성화하면 노크백 방향이 완전히 무작위가 됩니다 (이전 Athena 스타일).
stormgust_knockback: yes

// RENEWAL_CAST의 경우 (참고 2)
// 기본적으로 '-1' 값을 가진 스킬은 고정 시전 시간을 사용하여 시전 시간의 20%를 고정 시전 시간으로 사용하고 나머지 (80%)를 가변 시전 시간으로 사용합니다.
// 이 값을 0으로 설정하면 기본 고정 시전 시간이 비활성화됩니다 (skill_db.yml의 0과 동일).
default_fixed_castrate: 20

// 공식 서버에서는 경로 상의 모든 대상을 타격하는 스킬 (예: 포커스드 애로우 스트라이크 및 퍼스트 윈드)은 먼저 8개의 방향 중 하나를 계산한 다음 해당 방향을 기반으로 AoE를 적용합니다. 이는 해당 스킬이 특정 영역을 타격할 수 없는 경우가 있을 수 있습니다. 그러한 영역에 있는 몬스터를 대상으로 하면 해당 몬스터만 타격을 입습니다.
// 이 설정을 "아니요"로 설정하면 시전자에서 대상까지의 경로를 계산하여 해당 경로 근처의 모든 것을 타격합니다. 스킬_db에서 스플래시 및 maxcount를 조정하여 이러한 스킬의 너비와 길이를 조정할 수 있습니다.
// 참고: 브랜드 스피어는 특수한 피해 동작으로 인해 항상 이 알고리즘을 사용합니다.
skill_eightpath_algorithm: yes

// skill_eightpath_algorithm을 사용하는 스킬이 시전자의 셀에 있는 대상을 포함합니까?
// 공식: 예
skill_eightpath_same_cell: yes

// 아이스월 및 함정과 같은 피해 스킬 유닛을 손상시킬 수 있습니까 (참고 3)
// 공식 서버에서는 플레이어가 스킬로 아이스월 및 일부 함정을 손상시킬 수 있습니다. 몬스터가 스킬을 사용할 때, 피해가 아이스월 및 함정에 표시되지만 내구성에서 실제로 차감되지는 않습니다.
// 공식 설정은 MVP를 함정에 쉽게 가둘 수 있게 합니다. 모든 유닛이 스킬을 손상시킬 수 있도록 하려면 이 값을 31로 설정하십시오 (이전 동작).
can_damage_skill: 1

// 랜드 프로텍터 동작 (참고 1)
// 공식 서버에서는 플레이어가 랜드 프로텍터의 가장자리 (외부 셀)에 서 있을 때도 AoE 스킬 (예: 스톰 거스트)에 의해 영향을 받을 수 있습니다. Athena 동작은 플레이어가 가장자리에 서 있을 때 AoE 영향을 무시합니다.
// 공식: 0
// 이전 Athena: 1
land_protector_behavior: 0

// NPC EMOTION 동작 (참고 1)
// 공식 서버에서는 특정 몹이 NPC EMOTION 스킬을 시전하여 감정 아이콘을 표시하고 일정 시간 동안 공격적인 모드에서 수동 모드로 전환됩니다. Athena 동작은 수동 모드로 전환되지 않습니다.
// 공식: 0
// 이전 Athena: 1
npc_emotion_behavior: 0

// 타로 카드 오브 페이트가 각 카드가 발생할 동일한 확률을 가집니까? (참고 1)
// 공식 확률: 15%: 연인 | 10%: 바보, 마술사, 여사제, 힘, 태양 | 8%: 절제
// 7%: 전차 | 6%: 교수형 | 5%: 죽음, 별 | 2%: 탑 | 1%: 운명의 수레바퀴, 악마
// 이 값을 "예"로 설정하면 각 카드의 확률이 1/14가 됩니다.
tarotcard_equal_chance: no

// 대상이 노래 영역에 없을 때 디스펠이 노래에 적용됩니까? (참고 1)
// 공식 서버에서는 노래를 디스펠할 수 없습니다.
// 힌트: 반사면 사라지는 Rebellion 스킬 "Vanishing Buster"에도 영향을 미칩니다.
dispel_song: no

// 유전학자의 메이크 봄 스킬의 바나나 폭탄 앉기 지속 시간.
// 공식 지속 시간은 1000ms * 투척자의 직업 레벨 / 4입니다.
// 0: 공식 지속 시간 사용
// X: 사용자 정의 지속 시간을 밀리초 단위로 입력하십시오.
banana_bomb_duration: 0

// 생성하려는 아이템이 인벤토리에 공간이 없으면 드랍됩니까? (참고 1)
// 공식: 아니요
// 이전 rAthena 논리: 예
skill_drop_items_full: no

// EDP 설정: (참고 3)
// 오른손 무기를 전환/해제할 때 EDP가 제거됩니까? EDP는 맨손으로 사용할 수 없습니다.
// 0: 비활성화됨 (rAthena 이전 및 프리 리뉴얼 동작).
// 1: 프리 리뉴얼에서 활성화됨.
// 2: 리뉴얼에서 활성화됨.
// 3: 1+2
switch_remove_edp: 2

// 다른 파티원에게 메이스터의 어택 머신을 시전할 때 최대 레벨 차이.
// 기본값: 15
attack_machine_level_difference: 15
