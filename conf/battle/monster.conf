//--------------------------------------------------------------
// rAthena 전투 설정 파일
// 원래 번역: Peter Kieser <pfak@telus.net>
// 간단한 영어로 변경: Ancyker
//--------------------------------------------------------------
// 주의 1: 값은 설정 스위치 (on/off, yes/no 또는 1/0)
// 주의 2: 값은 백분율 (100은 100%를 의미합니다)
// 주의 3: 값은 비트 필드입니다. 설명이 없는 경우,
//         단위 유형을 가정합니다 (1: Pc, 2: Mob, 4: Pet, 8: Homun, 16: Mercenary, 128: NPC, 512: Elemental)
//--------------------------------------------------------------

// MVP의 HP 비율. (참고 2)
mvp_hp_rate: 100

// 일반 몬스터의 HP 비율 (MVP가 아닌 몬스터). (참고 2)
monster_hp_rate: 100

// 몬스터의 최대 공격 속도.
monster_max_aspd: 199

// 다양한 몬스터 AI 관련 설정을 정의합니다. (참고 3)
// 0x0001: 활성화되면 몬스터가 추적 중에 목표 셀을 업데이트합니다.
// 0x0002: 몬스터가 반격할 수 없을 때 "무례한 공격" 스킬을 사용합니다 (예: GrimTooth).
// 0x0004: 설정하지 않으면 몬스터는 [공격 범위+1] 거리 내에서만 목표를 변경합니다.
// 0x0008: 목표를 잃으면 몬스터가 흩어집니다.
// 0x0010: 설정하면 몬스터 스킬이 친구에게도 적용됩니다.
// 0x0020: 설정하면 플레이어가 있는 맵의 모든 몬스터에 대해 AI가 실행됩니다.
// 0x0040: 몬스터의 목표가 맵을 변경하면 몬스터가 NPC 워프 지점으로 이동합니다.
// 0x0080: 설정하지 않으면 몬스터는 일반 공격에만 목표를 변경합니다.
// 0x0100: 설정하면 몬스터가 무작위로 스킬을 선택합니다.
// 0x0200: 설정하면 몬스터의 스킬 재사용 대기시간이 개별 항목에만 적용됩니다.
// 0x0400: 모든 스킬에 대해 몬스터의 범위를 9로 설정합니다.
// 0x0800: 설정하면 몬스터가 도발한 사람에게 목표를 변경합니다.
// 0x1000: 설정하면 몬스터가 사용할 수 없는 스킬을 선택하면 다른 스킬을 찾습니다.
// 예: 0x140 -> 플레이어를 워프를 통해 추적 + 무작위로 스킬 사용.
monster_ai: 0

// 몬스터가 추적을 재고하는 빈도.
// 0: 100ms마다 (MIN_MOBTHINKTIME)
// 1: 이동한 셀마다
// x: 이동한 x 셀마다 또는 추적 경로 끝에서
// 30 (최대): 추적 경로 끝에서만 (공식)
// 몬스터가 공격 범위 내에서 항상 목표를 확인합니다.
monster_chase_refresh: 30

// 몬스터를 워프할 수 있습니까? (필요에 따라 추가)
// 0: 비활성화.
// 1: NPC 워프 지점에서 몬스터 워프 활성화
// 2: 프리스트 워프 포털에서 몬스터 워프 활성화
// 4: 'nobranch' 맵일 때 워프 비활성화.
// 8: 차원 문에서 몬스터 워프 활성화
mob_warp: 0

// 모든 플레이어가 떠난 후 몬스터가 AI를 활성화하는 시간 (ms 단위).
mob_active_time: 5000
boss_active_time: 5000

// 몬스터와 애완동물의 시야 조정 (mob_db의 range2 열) (참고 2)
view_range_rate: 100

// 추적 범위는 몬스터가 목표를 포기하기 전에 기본 최소 추적 범위입니다.
// 이는 mob_db의 range3 열입니다. (참고 2)
chase_range_rate: 100

// 몬스터가 Vulture's Eye와 Snake's Eye의 어느 레벨을 배워야 합니까?
// 공식적으로 몬스터는 이 스킬을 배우지 않으므로 원거리 스킬의 범위는 9입니다.
// 0보다 큰 값을 입력하면 범위가 해당 값만큼 증가합니다.
monster_eye_range_bonus: 0

// 몬스터가 적극적으로 먼저 공격합니까? (참고 1)
monster_active_enable: yes

// mob_db 이름이 스폰 파일에 지정된 몬스터 이름을 재정의합니까?
// 0: 아니요
// 1: 항상 mob_db Name 열 사용 (영어 몬스터 이름)
// 2: 항상 mob_db JName 열 사용 (원래 Kro 몬스터 이름)
override_mob_names: 0

// 몬스터 피해 지연율 (참고 1)
// no/0으로 설정하면 항상 인듀어와 같습니다.
monster_damage_delay_rate: 100

// 약탈 몬스터 행동.
// 0 = 몬스터가 아이템을 소비합니다.
// 1 = 몬스터가 아이템을 소비하지 않습니다.
monster_loot_type: 0

// 몬스터가 바닥 아이템을 찾는 방법.
// 0: 가장 가까운 (이전 Athena 스타일)
// 1: 범위 내에서 가장 오래된 (공식)
monster_loot_search_type: 1

// 몬스터가 스킬을 사용할 확률 (참고 2)
// 더 높은 비율은 몬스터 스킬 사용을 100%로 만듭니다.
// 0으로 설정하면 몬스터 스킬이 비활성화됩니다.
mob_skill_rate: 100

// 몬스터 스킬 지연 조정 (참고 2)
// 몬스터가 스킬을 사용한 후 재사용 대기 시간이 있습니다.
// 지연이 0인 스킬은 이 설정에 영향을 받지 않습니다.
mob_skill_delay: 100

// 맵의 몬스터 비율. 200은 정상보다 두 배 많은 것을 의미합니다. (참고 2)
mob_count_rate: 100

// 맵의 몬스터 리스폰 비율. 50은 몬스터가 두 배 빨리 리스폰하도록 만듭니다 (지연 시간 절반) (참고 2)
// 참고: 즉시 리스폰되는 몬스터에는 영향을 주지 않습니다 (대부분의 일반 몬스터).
mob_spawn_delay: 100
plant_spawn_delay: 100
boss_spawn_delay: 100

// 몬스터 리스폰 시간에 변동을 적용합니까? (참고 3)
// 공식 서버에서는 boss_monster 명령으로 소환된 몬스터 (대부분 MVP)만 변동이 있습니다. 레거시 Athena 동작은 모든 몬스터에 변동이 적용됩니다.
// 0: 없음
// 1: 보스 몬스터 (공식)
// 2: 일반 몬스터
// 3: 모든 몬스터 (레거시 Athena)
mob_spawn_variance: 1

// 플레이어 시야 내에 몬스터가 리스폰되지 않습니까?
// 0은 비활성화, 그렇지 않으면 리스폰을 포기하기 전에 재시도 횟수입니다.
// 최대 값 (100)을 사용하면 몬스터가 리스폰되지 않으며 5초 후에 다시 시도됩니다.
// 참고: 항상 동일한 셀에서 리스폰되는 몬스터에는 영향이 없습니다 (예: 개미 알).
no_spawn_on_player: 0

// 몬스터 스폰 파일의 스폰 좌표를 무시합니까? (참고 1)
// 예로 설정하면 모든 몬스터가 mob-spawn 파일과 상관없이 맵 전체에 무작위로 리스폰됩니다.
force_random_spawn: no

// 각 몬스터의 중심 셀이 무작위화됩니까? (참고 1)
// 공식적으로 서버 시작 시 각 몬스터의 중심 셀이 스폰 영역 내의 무작위 셀로 설정됩니다.
// 몬스터가 리스폰될 때마다 원래 스폰 정의의 중심이 아니라 중심 셀 주위에 리스폰됩니다.
// 이는 전체 스폰 영역을 훨씬 크게 만들고 각 서버 시작 시 다른 경험을 제공합니다.
// 모든 몬스터가 원래 스폰 정의의 중심 주위에 리스폰되기를 원하면 "no"로 설정하십시오.
randomize_center_cell: yes

// 소환된 슬레이브가 마스터의 수동/공격 특성을 상속합니까?
// 0: 아니요, 원래 모드를 유지합니다.
// 1: 슬레이브는 항상 공격적입니다.
// 2: 슬레이브는 항상 수동적입니다.
// 3: 마스터의 공격/수동 상태와 동일합니다.
// 4: 모드가 슬레이브 모드로 덮어씁니다 (공식).
slaves_inherit_mode: 4

// 소환된 슬레이브가 마스터와 동일한 이동 속도를 가집니까?
// 참고: 기본값은 3이며 공식 서버의 기본값입니다.
// 0: 절대 없음
// 1: 마스터가 걸을 수 있는 경우
// 2: 마스터가 걸을 수 없는 경우 (심지어 움직이지 않는 몬스터도 mob_db에 속도 항목이 있습니다)
// 3: 항상
slaves_inherit_speed: 3

// 소환된 몬스터 (연금술사 또는 @summon된 몬스터)가 마스터의 자동 스펠 카드를 발동할 기회를 제공합니까? (참고 1)
summons_trigger_autospells: yes

// 몬스터가 다른 몬스터에 의해 공격당할 때 몬스터가 해당 몬스터 대신 몬스터의 마스터에게 반격합니까?
// 참고: 소환된 몬스터는 @summon으로 소환된 몬스터와 연금술사에 의해 소환된 몬스터입니다.
retaliate_to_master: yes

// 스킬이 반격 몬스터 스킬을 트리거할 때 몬스터가 일시적으로 목표를 변경해야 합니까? (참고 1)
// 예: 몬스터가 플레이어 B를 공격하고 플레이어 A가 스킬 C를 시전합니다.
// 예로 설정하면 몬스터가 스킬을 트리거하는 스킬 C가 있다면 A가 스킬의 목표가 되고, 그렇지 않으면 B가 반격 스킬의 목표가 됩니다.
mob_changetarget_byskill: no

// 몬스터의 클래스가 변경되면 HP를 완전히 회복합니까? (참고 1)
monster_class_change_full_recover: yes

// 몬스터 이름 옆에 일부 정보를 표시합니까? (필요에 따라 추가)
// (수호자 또는 황궁에는 적용되지 않습니다)
// 1: 몬스터 HP 표시 (Hp/MaxHp 형식)
// 2: 몬스터 HP 표시 (전체 생명력 백분율 형식)
// 4: 몬스터의 레벨 표시
show_mob_info: 0

// 몬스터로부터 제니를 얻습니까?
zeny_from_mobs: no

// 몬스터 레벨 업 (몬스터가 플레이어를 죽일 때마다 레벨 업하고 강해집니다)
// 경험치 비율은 ((몬스터 레벨-원래 몬스터 레벨)*(exp*(mobs_level_up_exp rate/100)))으로 계산됩니다.
// 참고: WoE 수호자에게는 적용되지 않습니다.
mobs_level_up: no
mobs_level_up_exp_rate: 1

// 동적 몬스터 옵션
// 동적 몬스터를 사용합니까? (작은-중간 크기의 서버에 권장)
dynamic_mobs: yes

// 몬스터가 피해를 입더라도 제거
mob_remove_damaged: yes

// 빈 맵에서 몬스터를 제거하기 전에 지연 시간 (기본값 5분 = 300초)
mob_remove_delay: 300000

// 몬스터가 죽었을 때 몬스터 npc_event가 실행되는 플레이어를 정의합니다.
// 유형 1: 몬스터를 죽인 플레이어에게 (비플레이어에 의해 죽었을 경우 유형 0으로 재설정)
// 유형 0: 몬스터에게 가장 많은 피해를 준 플레이어에게.
// 참고: 이는 황궁이 파괴될 때 성을 차지하는 플레이어에게 영향을 미칩니다.
mob_npc_event_type: 1

// 킬 스틸 보호를 활성화하는 시간 (밀리초 단위)
// 비활성화하려면 0으로 설정합니다.
// 활성화되고 플레이어가 @noks를 사용하는 경우 파티에 없는 다른 플레이어 (KS)의 피해가 0으로 감소합니다.
ksprotection: 0

// MVP 슬레이브가 마스터에게 소환될 때 목표를 유지합니까?
mob_slave_keep_target: yes

// MVP 무덤을 스폰합니까?
// http://irowiki.org/wiki/MVP#Gravestone를 참조하십시오.
mvp_tomb_enabled: yes

// MVP 무덤을 스폰하기 전 지연 시간.
// 기본값: 9초
mvp_tomb_delay: 9000

// 특별히 소환된 몬스터의 크기가 경험치, 드롭률, 통계를 영향을 미칩니까?
// 비율은 큰 몬스터의 경우 두 배가 되고 작은 몬스터의 경우 절반이 됩니다.
// 이는 'monster' 명령, @monsterbig 및 @monstersmall에서만 호출됩니다. (참고 1)
// 기본값: 아니오
mob_size_influence: no

// 몬스터가 직접 시전된 얼음벽에 의해 갇히면 어떻게 됩니까?
// 공식 서버에서는 몬스터가 서쪽과 남쪽으로만 얼음벽을 떠날 수 있습니다. 그들의 목표가 북쪽이나 동쪽에 있으면 계속 추적하려고 시도하지만 실패합니다. 
// 이는 루프에 빠져들게 하며, 이 동안 유휴 및 추적 스킬을 사용합니다. 보스 몬스터는 가만히 있으며 유휴 및 공격받은 스킬을 사용합니다.
// 0: 몬스터가 전혀 얼음벽에 갇히지 않습니다.
// 1: 몬스터가 갇힌 몬스터처럼 행동합니다.
// 2-255: 몬스터가 얼음벽에서 벗어날 때까지 위의 행동을 반복하는 횟수입니다.
// 참고: 일부 서버에서는 일반 몬스터가 속도에 따라 15-35초 후에 얼음벽에서 벗어날 수 있습니다. 다른 서버에서는 얼음벽이 만료될 때까지 갇혀 있습니다. 
// 또한 많은 공식 서버 (예: iRO)에서는 보스 몬스터가 있는 모든 맵에서 얼음벽 시전이 완전히 차단됩니다.
// 기본값 (가장 악용 가능성 낮음): mob - 75, boss - 0
// 기본값 (가장 공식적): mob - 220, boss - 1
mob_icewall_walk_block: 75
boss_icewall_walk_block: 0

// 몬스터에 HP 바를 표시합니까?
// 2012-04-04aRagexeRE 이상의 클라이언트 필요.
monster_hp_bars_info: yes

// 몬스터가 오랜 시간 동안 움직이지 않았을 때 리스폰하고 맵 서버에 경고를 출력합니까?
// 이는 합법적인 게임 플레이일 수 있습니다 (예: 플레이어가 MVP를 얼음벽 안에 가두는 경우). 하지만 악용을 방지하고 알림을 받으려면 예로 설정할 수 있습니다.
monster_stuck_warning: no

// 플레이어가 없는 경우 몬스터가 유휴 스킬을 사용하는 비율 (참고 2)
// 공식 서버에서는 몬스터가 한 번 발견되면 플레이어가 더 이상 근처에 없더라도 유휴 스킬을 사용합니다.
// 이를 비활성화하려면 0으로 설정하십시오.
mob_nopc_idleskill_rate: 100
boss_nopc_idleskill_rate: 100

// 플레이어가 없는 경우 몬스터가 이동하는 비율 (참고 2)
// 공식 서버에서는 몬스터가 한 번 발견되면 플레이어가 더 이상 근처에 없더라도 항상 이동합니다.
// 이를 비활성화하려면 0으로 설정하십시오.
mob_nopc_move_rate: 100
boss_nopc_move_rate: 100

// 몬스터를 죽일 때, 동일 파티 내의 모든 사람이 해당 영역 내에서 AG_BATTLE 유형 업적을 트리거합니까?
// 영역은 area_size 전투 설정으로 제한됩니다.
achievement_mob_share: no

// 슬레이브가 추적 중 너무 멀어지면 마스터에게 순간이동합니까? (참고 1)
// 기본값 (공식): 아니오
slave_stick_with_master: no

// 몬스터의 절대 최소 리스폰 시간 (밀리초 단위).
// 길드가 로드되지 않을 때 수호자 스폰 지연에도 사용됩니다.
// 기본값 (공식): 1000
mob_respawn_time: 1000

// 몬스터가 갇혔을 때 목표를 잠금 해제하는 시간 (ms 단위).
// 이 시간 동안 몬스터는 여전히 유휴 모드이며 무작위 대상으로 유휴 스킬을 사용하지만 더 이상 갇히지 않으면 원래 목표를 계속 추적합니다.
mob_unlock_time: 2000
