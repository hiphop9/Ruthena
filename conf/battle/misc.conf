//--------------------------------------------------------------
// rAthena 전투 설정 파일
// 원래 번역: Peter Kieser <pfak@telus.net>
// 간단한 영어로 변경: Ancyker
//--------------------------------------------------------------
// 주의 1: 값은 설정 스위치 (on/off, yes/no 또는 1/0)
// 주의 2: 값은 백분율 (100은 100%를 의미합니다)
// 주의 3: 값은 비트 필드입니다. 설명이 없는 경우,
//         단위 유형을 가정합니다 (1: Pc, 2: Mob, 4: Pet, 8: Homun, 16: Mercenary, 128: NPC, 512: Elemental)
//--------------------------------------------------------------

// PK 서버 모드. 전체 서버를 PvP로 만듭니다 (마을 제외). 다른 플레이어에게 살해당할 경우 경험치 손실이 두 배로 증가합니다.
// 플레이어가 20레벨 이상의 몬스터를 사냥할 때 추가 경험치 15%를 받고, 더 많은 아이템을 받을 확률이 25% 증가합니다.
// 이 모드에서 PK가 활성화되지 않은 맵을 설정하는 nopvp.txt가 있습니다. 초보자는 공격받을 수 없고 공격할 수 없습니다.
// 일반 PvP 카운터 및 순위 표시도 비활성화됩니다.
// 참고: pk_mode가 1 (yes) 대신 2로 설정된 경우,
//   플레이어는 다른 플레이어를 죽일 때마다 매너 페널티 5를 받습니다 (매너 시스템
//   설정을 통해 플레이어에게 어떤 영향을 미칠지 조정할 수 있습니다).
pk_mode: 0

// 플레이어가 PK 존에 들어갈 때 메시지를 표시합니까? (참고 1)
pk_mode_mes: yes

// 매너/카르마 시스템 설정. 부정적인 매너 (빨간 채팅 거품 없음)가 플레이어에게 미치는 영향을 지정합니다 (필요에 따라 추가):
//  0: 페널티 없음.
//  1: 채팅 비활성화 (귓속말, 파티/길드 메시지 등 포함)
//  2: 스킬 사용 비활성화
//  4: 명령어 사용 비활성화
//  8: 아이템 사용/픽업/드롭 비활성화
// 16: 방 생성 비활성화 (채팅방 및 상점)
manner_system: 15

// PK 서버 모드. PK를 시작할 수 있는 최소 레벨을 정의합니다.
pk_min_level: 55

// PK 서버 모드. 플레이어가 서로 공격할 수 있는 최대 레벨 차이를 지정합니다. 0은 해당 제한을 비활성화합니다.
pk_level_range: 0

// PK 서버를 위한 설정. 피해 조정 설정은 WoE와 동일한 논리를 따릅니다 (guild.conf 참조).
pk_short_attack_damage_rate: 80
pk_long_attack_damage_rate: 70
pk_weapon_attack_damage_rate: 60
pk_magic_attack_damage_rate: 60
pk_misc_attack_damage_rate: 60

// 스킬 사용을 콘솔에 표시합니까? (디버그 전용) (기본값: off) (참고 3)
skill_log: off

// 전투 로그를 표시합니까? (디버그 전용) (기본값: off) (참고 1)
battle_log: off

// 기타 사항을 표시합니까? (디버그 전용) (기본값: off) (참고 1)
etc_log: off

// 워프 포인트를 디버그합니까? 예로 설정하면 워프 포인트가 깃발로 나타납니다. (참고 1)
// 시작 시 워프 포인트를 확인하여 터치 NPC 위에 직접 연결되는 워프 포인트를 출력합니다 (무한 루프 워프 상황으로 이어질 수 있음).
warp_point_debug: no

// 서버가 밤 (yes) 또는 낮 (no)으로 시작하도록 선택합니다.
night_at_start: no

// 낮의 지속 시간을 밀리초 단위로 정의합니다 (기본값: 7200000 = 2시간).
// 주기 (하지만 @day GM 명령어는 아님)를 비활성화하려면 0으로 설정합니다.
// 0을 제외하고, 최소값은 60000 (1분)입니다.
day_duration: 0

// 밤의 지속 시간을 밀리초 단위로 정의합니다 (기본값: 1800000 = 30분).
// 주기 (하지만 @night GM 명령어는 아님)를 비활성화하려면 0으로 설정합니다.
// 0을 제외하고, 최소값은 60000 (1분)입니다.
night_duration: 0

// PvP 맵에서 결투 사용
duel_allow_pvp: no

// GvG 맵에서 결투 사용
duel_allow_gvg: no

// 결투 중 텔레포트/워프 사용 허용
duel_allow_teleport: no

// 죽을 때 자동으로 결투 종료
duel_autoleave_when_die: yes

// @duel 명령어 사용 간의 지연 시간 (분 단위)
duel_time_interval: 60

// 같은 맵에서만 결투 사용 제한
duel_only_on_same_map: no

// 하나의 셀에 쌓일 수 있는 최대 캐릭터 수를 결정합니다.
// 공식 - 캐릭터의 걷기 루틴에만 영향을 미치며 몬스터도 포함됩니다.
// 유닛이 걷기를 멈추고 셀에 최대 쌓기 제한보다 많은 캐릭터가 있는 경우,
// 가장 가까운 빈 셀로 이동합니다.
// 셀 쌓기 검사를 하지 않으려면 0으로 설정하고 자유롭게 이동할 수 있습니다.
// 사용자 정의 - 이 변형은 모든 꽉 찬 셀이 벽으로 간주되도록 합니다.
// 참고: 사용자 정의 설정이 적용되려면 셀 쌓기 제한 지원으로 컴파일된 서버를 사용해야 합니다 (src/map/map.hpp 참조).
official_cell_stack_limit: 1
custom_cell_stack_limit: 1

// 자동 거래를 autotrade 플래그가 있는 맵에서만 허용합니까?
// "no"로 설정하면 autotrade 맵플래그가 설정되지 않은 곳에서도 autotrade를 허용합니다.
// "yes"로 설정하면 autotrade 맵플래그가 있는 맵에서만 autotrade를 허용합니다.
at_mapflag: no

// 자동 거래 캐릭터가 서버에서 추방되는 시간 (분 단위).
at_timeout: 0

// 자동 거래 중인 플레이어를 공격할 수 없도록 만듭니까? (플레이어의 state.monster_ignore를 켭니다) (참고 1)
at_monsterignore: no

// 자동 거래가 OnPCLogout 스크립트 이벤트를 트리거해야 합니까? (참고 1)
at_logout_event: yes

// 경매 시스템, 시간당 수수료. 기본값은 12000
auction_feeperhour: 12000

// 경매 최대 판매 가격
auction_maximumprice: 500000000

// 각 상점 검색 쿼리 사이의 최소 지연 시간 (초 단위).
searchstore_querydelay: 10

// 상점 검색 쿼리가 취소되기 전에 결과의 최대 개수.
searchstore_maxresults: 30

// 캐시 포인트의 획득 및 손실이 표시됩니까? (참고 1).
// 기본값: no
cashshop_show_points: no

// 로그인 시 메일 박스 상태가 표시됩니까?
// 기본값: 0
// 0 = 아니오
// 1 = 예
// 2 = 읽지 않은 메일이 있을 때만 예
mail_show_status: 0

// 사용자가 하루에 보낼 수 있는 메일의 양.
// 기본값: 100
// 0 = 무제한
mail_daily_count: 100

// 메일을 통해 제니를 전송할 때 수수료 (참고 2)
// 참고: 이 비율은 클라이언트에 하드코딩되어 있으며, 이 값을 변경하려면 클라이언트를 수정해야 합니다.
// 기본값: 2 (2%)
// 0 = 수수료 없음
mail_zeny_fee: 2

// 첨부된 아이템당 지불해야 하는 제니의 양
// 참고: 이 수수료는 클라이언트에 하드코딩되어 있으며, 이 값을 변경하려면 클라이언트를 수정해야 합니다.
// 기본값: 2500
// 0 = 수수료 없음
mail_attachment_price: 2500

// 메일에 첨부할 수 있는 총 최대 무게
// 참고: 이 제한은 클라이언트에 하드코딩되어 있으며, 이 값을 변경하려면 클라이언트를 수정해야 합니다.
// 기본값: 2000
// 0 = 무게 제한 없음
mail_attachment_weight: 2000

// 길드 전쟁 중 몬스터 변신이 비활성화됩니까?
// yes로 설정하면 WoE 시간 동안 성에 들어갈 때 몬스터 변신이 자동으로 제거/비활성화됩니다.
mon_trans_disable_in_gvg: no

// 아이템/포인트 상점에서의 아이템 가격이 할인됩니까?
// 0 = 아니오 (기본값)
// 1 = 아이템 상점
// 2 = 포인트 상점
// 3 = 아이템 및 포인트 상점
discount_item_point_shop: 0

// "login-serv가 플레이어 '%.*s'을(를) %s하도록 요청했습니다." 메시지를 표시하지 않음 (참고 1)
disp_servervip_msg: no

// 새 메일을 다시 보낼 수 있는 지연 시간 (기본값 및 최소값: 1000)
mail_delay: 1000

// 플레이어의 즐겨찾기 탭에 있는 아이템을 NPC에게 판매할 때 숨깁니까? (참고 1)
hide_fav_sell: no

// 맵에서 무작위 위치를 검색할 때 맵의 경계 중 어느 정도를 고려하지 않습니까?
// 공식적으로 맵의 가장자리에서 각 측면의 15 타일은 대상 셀로 간주되지 않습니다.
// 피라미드와 같은 일부 맵에서는 외부 지역에 몬스터가 거의 없는 원인이 됩니다. 이는 텔레포트에도 영향을 미칩니다.
// 예전 에뮬레이터 동작에 더 가깝게 하려면 1로 설정하십시오.
// 유효 값: 1-40
map_edge_size: 15

// 플레이어가 아이템을 드롭할 때 같은 셀에 쌓을 수 있습니까? (참고 1)
// 공식적으로는 같은 셀에 아이템을 드롭하는 데 제한이 없습니다.
// "no"로 설정하면 아이템을 드롭할 때 이미 아이템이 없는 셀에만 드롭됩니다.
// 8방향으로 빈 셀을 검색합니다. 해당 8방향에서 빈 셀을 찾지 못하면,
// 아이템 드롭이 실패하고 (아이템이 플레이어 인벤토리에 남아 있습니다).
item_stacking: yes
