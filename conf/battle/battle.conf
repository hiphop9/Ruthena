//--------------------------------------------------------------
// rAthena 전투 설정 파일
// 원래 번역: Peter Kieser <pfak@telus.net>
// 간단한 영어로 변경: Ancyker
//--------------------------------------------------------------
// 주의 1: 값은 설정 스위치 (on/off, yes/no 또는 1/0)
// 주의 2: 값은 백분율 (100은 100%를 의미합니다)
// 주의 3: 값은 비트 필드입니다. 설명이 없는 경우,
//         단위 유형을 가정합니다 (1: Pc, 2: Mob, 4: Pet, 8: Homun, 16: Mercenary, 128: NPC, 512: Elemental)
//--------------------------------------------------------------

// 기본 공격력(baseatk) 값을 가진 사람은 누구인가요? (힘(str)이 피해에 영향을 미치게 합니다)? (참고 3)
enable_baseatk: 0x9
enable_baseatk_renewal: 0x29F

// 완벽 회피(perfect flee)를 가질 수 있는 사람은 누구인가요? (참고 3)
enable_perfect_flee: 1

// 치명타 공격(critical attacks)을 할 수 있는 사람은 누구인가요? (참고 3)
// (이 설정과 관계없이 항상 치명타가 발생하는 스킬이 일부 존재합니다)
enable_critical: 17

// 비플레이어의 치명타 조정 비율 (참고 2)
mob_critical_rate: 100
critical_rate: 100

// 일반 공격이 이동 지연을 발생시키나요? (참고 3)
// 아니오로 설정하면, 캐릭터가 공격을 시작한 후 즉시 이동할 수 있습니다 (공격 애니메이션
// 또는 이동 애니메이션이 클라이언트 측에서 생략될 수 있어, 공격이 잘리거나
// 몬스터가 당신에게 텔레포트할 수 있습니다)
// 그렇지 않으면, 지연 시간은 '공격 애니메이션' (amotion)과 같습니다
attack_walk_delay: 15

// 타격 후 이동 지연 조정. (참고 2)
// 타격 후 '이동 불가' 지연은 피해 애니메이션 지속 시간의 백분율로 계산됩니다.
// NOTE: 이것은 단일 공격의 정상적인 지연에만 영향을 미치며, 아래의 multihit_delay 옵션으로 추가된 지연에는 영향을 미치지 않습니다.
pc_damage_walk_delay_rate: 20
damage_walk_delay_rate: 100

// 다중 타격 공격에 대한 이동 지연 조정.
// Lord of Vermillion이나 Jupitel Thunder와 같은 다중 타격 스킬에 의해 타격당하면, 캐릭터는 
// 추가적인 "(타격 수 -1) * multihit_delay" 밀리초 동안 이동할 수 없습니다.
// 80은 Aegis와 비슷한 설정 (Sonic Blows에 대한)입니다.
// 230은 마지막 타격까지 이동 지연이 지속되게 만드는 설정 (Jupitel Thunder에 대한)
multihit_delay: 80

// 플레이어에 대한 피해 지연 비율 (참고 2)
// (0으로 설정하면 항상 견딜 수 있는 것과 같습니다)
player_damage_delay_rate: 100

// 상대방을 언데드로 간주할 때, 요소(element) 또는 종족(race)을 사용할까요?
// 0 = 요소가 언데드
// 1 = 종족이 언데드
// 2 = 둘 다 (둘 중 하나가 작동)
undead_detect_type: 0

// 자신과 동일한 속성의 공격을 받으면 HP가 회복되나요? (참고 1)
attribute_recover: no

// 일반 공격의 최소 및 최대 명중률은 얼마인가요?
min_hitrate: 5
max_hitrate: 100

// 플레이어를 겨냥하는 몬스터가 agi_penalty_count를 초과할 때 FLEE에 적용되는 패널티의 유형
// 0 = 패널티가 적용되지 않음
// 1 = agi_penalty_num이 FLEE에서 백분율로 감소
// 2 = agi_penalty_num이 FLEE에서 정확한 양으로 감소
agi_penalty_type: 1

// agi 패널티가 활성화되었을 때, 누구에게 적용되어야 하나요? (참고 3)
// 기본적으로 플레이어만 패널티를 받습니다.
agi_penalty_target: 1

// 플레이어를 겨냥하는 몬스터가 몇 마리 이상일 때 FLEE에 패널티가 적용되나요
agi_penalty_count: 3

// agi_penalty_count를 초과하는 각 공격 몬스터당 패널티로 감소하는 FLEE의 양
agi_penalty_num: 10

// 장비 및 VIT 방어력에 대해 vit_penalty_count를 초과하는 몬스터가 타겟일 때 적용되는 패널티의 유형
// 0 = 패널티가 적용되지 않음
// 1 = vit_penalty_num이 DEF에서 백분율로 감소
// 2 = vit_penalty_num이 DEF에서 정확한 양으로 감소
vit_penalty_type: 1

// vit 패널티가 활성화되었을 때, 누구에게 적용되어야 하나요? (참고 3)
// 기본적으로 플레이어만 패널티를 받습니다.
vit_penalty_target: 1

// 플레이어를 겨냥하는 몬스터가 몇 마리 이상일 때 방어력에 패널티가 적용되나요
vit_penalty_count: 3

// vit_penalty_count를 초과하는 각 공격 몬스터당 패널티로 감소하는 VIT 방어력의 양
vit_penalty_num: 5

// 물리 공격에 대해 DEF 계산의 대체 방법을 사용할까요?
// 0으로 설정하면 비활성화됨 (정상적인 def% 감소와 추가적인 def2 감소를 사용합니다)
// 1 이상으로 설정하면 방어력이 (DEF * 값)의 차감으로 계산됩니다.
// 예: 10 + 50 def는 0 + (10*유형 + 50)로 변환됩니다
weapon_defense_type: 0

// MDEF, 위와 같음. (MDEF * 값)
magic_defense_type: 0

// 공격할 때마다 공격자의 방향을 상대방을 향하게 할까요? (참고 3)
// NOTE: 공식 서버에서는 Firewall과 같은 스킬의 넉백이 항상
// 마지막으로 이동한 방향을 기준으로 합니다. 완전히 다른 방향으로 공격하더라도,
// 넉백 방향은 변경되지 않으며, 예를 들어 북쪽으로 이동한 후 남쪽에 있는 적을 공격하면,
// Firewall에 의해 여전히 남쪽으로 넉백됩니다. 이동 불가 몬스터는
// 기본 방향이 북쪽이므로 항상 남쪽으로 넉백됩니다.
attack_direction_change: 0

// 설정된 사람들은 선천적인 공격 속성이 "비속성"으로 설정됩니다
// (모든 방어-속성에 대해 100%) (참고 3)
// NOTE: 이것은 비플레이어가 일반 공격으로 Ghostring과 같은 유령형 타겟에 대해
// 전체 피해를 입힐 수 있게 만드는 설정입니다.
attack_attr_none: 14

// 장비가 깨지는 비율 (스킬에 의해 수정되기 전 기본 비율)
// 1 = 0.01% 확률. 공식 서버의 기본값: 0
equip_natural_break_rate: 0

// 자신의 장비가 깨질 수 있는 전체 비율. (참고 2)
// 이 비율은 power-thrust와 같은 스킬의 패널티 파손 비율과 장비 자체 파손 비율
// (equip_natural_break_rate) 모두에 영향을 미칩니다. 만약 Sage의 endow 스킬이 실패하고
// 이 값이 0 이상일 경우, 선택된 캐릭터의 무기가 파손됩니다.
equip_self_break_rate: 100

// 목표의 장비가 깨질 수 있는 전체 비율. (참고 2)
// 이 비율은 acid terror와 meltdown과 같은 스킬의 동작에 영향을 미칩니다.
equip_skill_break_rate: 100

// 피해가 적용되기 전에 지연이 있나요? (참고 1)
// 일부 스킬은 이 설정과 관계없이 기본적으로 지연이 없을 수 있습니다.
// 공식 설정은 "예"이며, 성능이 다소 저하될 수 있습니다.
delay_battle_damage: yes

// 클라이언트와 서버 간에 피해 타이밍을 동기화해야 하나요? (참고 1)
// 이것은 공식 동작은 아니지만, 몬스터의 공격에 맞은 후 위치 지연을 제거해야 합니다.
// 이 설정은 일반 몬스터 공격에만 영향을 미치며, "delay_battle_damage"보다 우선합니다.
// 많은 스킬은 즉시 피해를 보여주므로, 동시에 "delay_battle_damage"를 "아니오"로 설정하면
// 경험이 더욱 향상될 수 있지만, 모든 스킬에 대해 작동하지는 않습니다.
// Dark Illusion이 5초 늦게 맞는 것이 지겹다면, 이 설정을 켜십시오.
synchronize_damage: no

// 활/총에서 화살/탄약이 사용되나요?
// 0 = 아니오
// 1 = 예
// 2 = 무기 기반 스킬에 대해 명시적으로 화살 소비가 없는 경우에도 예
//     해당 스킬이 카드 또는 표절을 통해 획득된 경우에도 예
arrow_decrement: 1

// 무기를 해제할 때 탄약을 해제해야 하나요?
// 공식 동작은 "예"입니다.
ammo_unequip: yes

// 탄약을 장착할 때 적절한 무기를 장착해야 하나요?
// 공식 동작은 "예"입니다.
ammo_check_weapon: yes

// 아이템 스크립트 보너스 'Autospell'이 시전하기 전에 거리/장애물을 확인해야 하나요?
// 공식 동작은 "아니오"이며, 이 설정을 "예"로 설정하면 스킬이 정의된 거리를 사용하게 됩니다.
// 예를 들어, Sonic Blow는 자동 시전이 허용되기 전에 2셀 거리가 필요합니다.
// 이 설정은 autospellwhenhit에도 영향을 미칩니다.
autospell_check_range: no

// 공격자와 대상이 동일한 타일에 있을 때, 대상이 왼쪽으로 넉백되어야 하나요?
// 공식 동작은 "예"이며, 이 설정을 "아니오"로 설정하면 대상이 공격자 뒤로 넉백됩니다.
knockback_left: yes

// 플레이어가 Falcons와 Wargs를 동시에 사용할 수 있나요? (참고 1)
// 이것은 공식 서버에서는 허용되지 않습니다.
warg_can_falcon: no

// 타겟이 화면 가장자리로 도약하여 피해를 피할 수 있어야 하나요?
// 공식 동작은 "아니오"입니다.
snap_dodge: no

// 플레이어 스킬/아이템이 비플레이어 장비를 "파손"할 수 있어야 하나요? (참고 1)
// 이는 효과적으로 비플레이어 대상에게 장비 해제 효과를 적용합니다.
// NOTE: WS_MELTDOWN은 비활성화된 경우 이 확인에서 제외됩니다.
// 공식: 아니오
break_mob_equip: no
