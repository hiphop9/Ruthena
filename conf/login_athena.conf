// Athena 로그인 서버 설정 파일.
// 번역: Peter Kieser <pfak@telus.net>

// 참고: "주석"은 더블 슬래시 "//"의 오른쪽에 있는 모든 텍스트입니다.
// 주석 처리된 텍스트는 서버에서 파싱되지 않으며, 정보/참조용으로만 사용됩니다.

// 로그인 서버가 이 IP 주소로 인터페이스에서 수신 대기합니다.
// 참고: 이를 통해 여러 인터페이스에서 동일한 포트를 사용하여 여러 서버를 실행할 수 있습니다.
//bind_ip: 127.0.0.1

// 로그인 서버 포트
login_port: 6900

// 모든 메시지 앞에 인쇄되는 타임스탬프 형식.
// 최대 20자까지 가능합니다.
// 일반적인 형식:
// %I:%M:%S %p (시간:분:초 12시간 형식, AM/PM 형식)
// %H:%M:%S (시간:분:초 24시간 형식)
// %d/%b/%Y (일/월/년)
// 전체 형식 정보는 strftime() 매뉴얼을 참조하십시오.
//timestamp_format: [%d/%b %H:%M]

// 리디렉션된 출력에 이스케이프 시퀀스(색상 코드)가 포함된 경우
stdout_with_ansisequence: no

// 서버가 선택한 메시지 유형을 /log/ 폴더에 파일로 기록합니다.
// 1: 경고 메시지 기록
// 2: 오류 및 SQL 오류 메시지 기록
// 4: 디버그 메시지 기록
// 예: "console_msg_log: 7"은 세 가지 모두 기록합니다.
// 이 설정으로 기록된 메시지는 console_silent 설정을 무시합니다.
console_msg_log: 0

// 위의 콘솔 메시지를 저장할 파일 경로
console_log_filepath: ./log/login-msg_log.log

// 특정 유형의 메시지를 생략하여 서버 출력을 더 조용하게 만듭니다:
// 1: 정보 메시지 숨기기
// 2: 상태 메시지 숨기기
// 4: 공지 메시지 숨기기
// 8: 경고 메시지 숨기기
// 16: 오류 및 SQL 오류 메시지 숨기기
// 32: 디버그 메시지 숨기기
// 예: "console_silent: 7"은 정보, 상태 및 공지 메시지를 숨깁니다 (1+2+4)
console_silent: 0

// 콘솔 명령
// 콘솔 명령 사용 여부를 켜고 끕니다.
// 이는 >& log.file 사용을 방지합니다.
console: off

// 서버에서 새로운 계정을 만들기 위해 _M/_F를 사용할 수 있습니까?
// 참고: 클라이언트 측 비밀번호 암호화가 활성화되지 않은 경우에만 작동합니다.
new_account: yes

// new_account가 활성화된 경우, 계정 이름의 최소 길이를 변경합니다.
// 기본값은 '4' 또는 '6'(새 로그인 UI에 따라 다름)으로 설정됩니다.
// 클라이언트가 '4/6자 사용자 이름 제한 제거' diff 패치를 사용하지 않는 한 변경하지 마십시오.
//acc_name_min_length: 6

// new_account가 활성화된 경우, 비밀번호의 최소 길이를 변경합니다.
// 기본값은 '4' 또는 '6'(새 로그인 UI에 따라 다름)으로 설정됩니다.
// 클라이언트가 '4/6자 비밀번호 제한 제거' diff 패치를 사용하지 않는 한 변경하지 마십시오.
//password_min_length: 6

// 계정 등록 플러드 보호 시스템
// allowed_regs는 허용된 등록 수, time_allowed는 초 단위의 시간입니다.
allowed_regs: 1
time_allowed: 10

// 로그 파일 이름. 서버에서 수신한 모든 작업이 이 파일에 기록됩니다.
login_log_filename: log/login.log

// 로그인 서버를 기록할 것인가요?
// 참고: 동적 비밀번호 실패 차단을 활성화하려면 로그인 서버가 로그인 로그를 필요로 합니다.
log_login: yes

// 로그, 플레이어 등에게 날짜를 표시하는 방법을 나타냅니다.
date_format: %Y-%m-%d %H:%M:%S

// 서버에 연결할 수 있는 계정 그룹 ID가 필요합니다.
// -1: 비활성화
// 0 이상: 그룹 ID
group_id_to_connect: -1

// 서버에 연결할 수 있는 최소 계정 그룹 ID가 필요합니다.
// group_id_to_connect 설정이 활성화된 경우에는 작동하지 않습니다.
// -1: 비활성화
// 0 이상: 그룹 ID
min_group_id_to_connect: -1

// VIP 그룹으로 지정될 그룹 (ID)은 무엇입니까?
// 기본값: 5
vip_group: 5

// 계정당 허용되는 최대 캐릭터 수는 얼마입니까?
// MAX_CHARS 슬롯의 한도를 초과할 수 없으며, mmo.hpp에서 정의된 chars_per_account는
// 기본적으로 MAX_CHARS로 설정됩니다.
// 0으로 설정하면 MIN_CHARS의 값이 기본값으로 설정됩니다.
chars_per_account: 0

// VIP 계정의 최대 캐릭터 수 증가 (0은 비활성화)
// vip_char_increase를 증가시키려면 MAX_CHARS의 값을 증가시키십시오.
// 참고: VIP 캐릭터의 수 = MAX_CHARS - chars_per_account.
// 참고 2: 이 설정은 chars_per_account 이후에 설정해야 합니다.
// -1은 MAX_CHAR_VIP (src/config/core.hpp)로 기본 설정됩니다.
vip_char_increase: -1

// 제한된 시간 동안 계정을 만드시겠습니까?
// -1: 새 계정은 무제한 시간으로 생성됩니다 (기본값)
// 0 이상: 새 계정은 지정된 시간(초 단위) 이후에 자동으로 만료됩니다.
start_limited_time: -1

// 비밀번호를 일반 텍스트 대신 MD5 해시로 저장합니까?
// 참고: <passwordencrypt>를 사용하는 클라이언트와 작동하지 않습니다.
use_MD5_passwords: no

// 로그인 창의 사용자 수 색상화 (PACKETVER >= 20170726 필요)
// 색상화 및 설명을 일반적으로 비활성화하시겠습니까?
usercount_disable: no
// 녹색으로 표시될 사용자 수
usercount_low: 200
// 노란색으로 표시될 사용자 수
usercount_medium: 500
// 빨간색으로 표시될 사용자 수
usercount_high: 1000

// IP 차단 기능
ipban_enable: yes
// 동적 비밀번호 실패 IP 차단 시스템
// 실패한 시도 후 사용자를 차단하시겠습니까?
ipban_dynamic_pass_failure_ban: yes
// 실패한 시도를 계산할 간격 (분 단위).
ipban_dynamic_pass_failure_ban_interval: 5
// 차단하기 전 최대 실패 시도 횟수.
ipban_dynamic_pass_failure_ban_limit: 7
// 차단 기간 (분 단위).
ipban_dynamic_pass_failure_ban_duration: 5
// 만료된 IP 차단을 정리하는 간격 (초 단위). 0 = 비활성화. 기본값 = 60.
// 참고: 이를 비활성화해도 만료된 IP 차단은 로그인 서버 시작/중지 시 정리됩니다.
// 만료 시간이 이미 지난 ipban 항목이 존재해도 플레이어는 여전히 로그인할 수 있습니다.
ipban_cleanup_interval: 60

// DNS/IP 업데이트를 실행하는 간격 (분 단위). 기본적으로 비활성화됨.
// 서버가 시간에 따라 변경되는 동적 IP를 사용하는 경우 이를 활성화하십시오.
//ip_sync_interval: 10

// DNS 블랙리스트 차단
// 활성화되면 각 수신 연결이 지정된 dnsbl_servers (쉼표로 구분된 목록)의 블랙리스트와 비교됩니다.
use_dnsbl: no
dnsbl_servers: bl.blocklist.de, socks.dnsbl.sorbs.net
// 여기 몇 가지 무료 DNS 블랙리스트 서비스가 있습니다: http://en.wikipedia.org/wiki/Comparison_of_DNS_blacklists
//==============================================================================
//   dnsbl_servers                 설명
// - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
// bl.blocklist.de                 SSH, FTP, IMAP 등을 통해 다른 서버/허니팟을 공격하는 IP 주소
// ircbl.ahbl.org                  AHBL (오픈 프록시, 감염된 기기, 댓글 스팸)
// safe.dnsbl.sorbs.net            "최근" 및 "에스컬레이션"을 제외한 dnsbl.sorbs.net의 모든 영역
// sbl-xbl.spamhaus.org            스팸하우스 블랙리스트 (스패머, 오픈 프록시)
// socks.dnsbl.sorbs.net           오픈 SOCKS 프록시 서버
// tor.ahbl.org                    현재 토르 릴레이 및 종료 노드

// 클라이언트 MD5 해시 확인
// 활성화되면 로그인 서버는 클라이언트의 해시가 아래 값과 일치하는지 확인하고
// 조작된 클라이언트를 연결하지 않습니다.
// 참고: 자세한 내용은 'doc/md5_hashcheck.txt'를 참조하십시오.
client_hash_check: off

// 웹 인증 토큰 시스템 활성화
// 이는 HTTP를 통한 추가 API를 통해 데이터를 수신하는 새로운 클라이언트에 필요합니다.
use_web_auth_token: yes

// 캐릭터가 로그오프 한 후 웹토큰을 비활성화하는 지연 시간 (밀리초 단위)
// 클라이언트가 로그오프할 때 경합 조건이 있습니다. 클라이언트가 변경된 구성을 저장하기 전에
// char-server가 토큰을 철회할 수 있습니다.
disable_webtoken_delay: 10000

// 클라이언트 MD5 해시
// 지정된 해시를 가진 클라이언트는 주어진 값보다 크거나 같은 group_id를 가진 플레이어가 로그인할 수 있습니다.
// 해시를 '비활성화됨'으로 지정하면, 해당 값보다 크거나 같은 group_id를 가진 플레이어는 해시와 상관없이 로그인할 수 있습니다 (클라이언트가 해시를 전송하지 않아도).
// 형식: group_id, 해시
// 참고: 자세한 내용은 'doc/md5_hashcheck.txt'를 참조하십시오.
//client_hash: 0, 113e195e6c051bb1cfb12a644bb084c5
//client_hash: 10, cb1ea78023d337c38e8ba5124e2338ae
//client_hash: 99, disabled

import: conf/inter_athena.conf
import: conf/import/login_conf.txt
